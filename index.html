   Luật nằm ở tab CLASSIFY_RULES trong Google Sheet. Sửa luật KHÔNG cần đụng code.
   Mỗi luật gồm: mau_khop (mẫu) · kieu_khop (cách khớp) · gia_tri_gan (nhãn) ·
   do_uu_tien (số nhỏ chạy trước). Luật ĐẦU TIÊN khớp là chốt, không xét tiếp.
   ============================================================================ */

/* Bỏ dấu để khớp cho cả người gõ có dấu lẫn không dấu.
   NHƯNG bỏ dấu làm "môi"→"moi" trùng với "mới", "mày"→"may" trùng "máy".
   Nên có thêm kiểu khớp regex_dau chạy trên chữ CÒN NGUYÊN DẤU. */
function _bd(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()
    .replace(/[^a-z0-9]+/g,' ').trim();
}
function _cd(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }

const _reCache = new Map();
function _re(p){
  if(!_reCache.has(p)){
    try{ _reCache.set(p, new RegExp(p)); }
    catch(e){ _reCache.set(p, null); }   // mẫu sai cú pháp -> coi như không khớp
  }
  return _reCache.get(p);
}
function _khop(bd, cd, mau, kieu){
  switch(kieu){
    case 'default':   return true;
    case 'exact':     return bd===mau;
    case 'contains':  return mau!=='' && bd.indexOf(mau)>-1;
    case 'prefix':    return mau!=='' && bd.indexOf(mau)===0;
    case 'regex':     { const r=_re(mau); return !!r && r.test(bd); }
    case 'regex_dau': { const r=_re(mau); return !!r && r.test(cd); }
    default:          return false;
  }
}
function layLuat(loai){
  return (D.CLASSIFY_RULES||[])
    .filter(r=>r.loai_rule===loai && String(r.dang_bat).toUpperCase()!=='FALSE')
    .map(r=>({ma:r.rule_id, mau:r.mau_khop||'', kieu:(r.kieu_khop||'').trim(),
              gan:r.gia_tri_gan||'', uu:toFloat(r.do_uu_tien)??999}))
    .sort((a,b)=>a.uu-b.uu);
}
function phanLoai(q, luat, cache){
  if(cache && cache.has(q)) return cache.get(q);
  const bd=_bd(q), cd=_cd(q);
  let out={gan:null, ma:null};
  for(const L of luat){ if(_khop(bd,cd,L.mau,L.kieu)){ out={gan:L.gan, ma:L.ma}; break; } }
  if(cache) cache.set(q,out);
  return out;
}

/* Dựng bảng truy vấn theo tháng, đã gắn nhãn chủ đề + ý định. Tính một lần rồi giữ lại. */
function qmData(){
  if(M._qm) return M._qm;
  const rowsRaw = D.GSC_QUERY_MONTHLY||[];
  const lCd = layLuat('chu_de_query'), lYd = layLuat('y_dinh_query');
  const cCd = new Map(), cYd = new Map();
  let rows = rowsRaw.map(r=>{
    const q=r.query||'';
    return { thang:r.thang, q,
      c:toInt(r.clicks)||0, i:toInt(r.impressions)||0, pos:toFloat(r.position),
      cd: lCd.length? (phanLoai(q,lCd,cCd).gan||'—') : '—',
      yd: lYd.length? (phanLoai(q,lYd,cYd).gan||'—') : '—' };
  }).filter(r=>r.thang);

  let thangs=[...new Set(rows.map(r=>r.thang))].sort();
  /* Cắt ngay tại nguồn: mọi bảng và biểu đồ đọc qmData() đều tự giới hạn theo,
     không phải nhớ cắt ở từng chỗ hiển thị. */
  thangs = thangs.slice(-SO_THANG);
  const giu = new Set(thangs);
  rows = rows.filter(r=>giu.has(r.thang));
  /* đối chiếu với tổng click thật của GSC_MONTHLY để biết Google giấu bao nhiêu */
  const thatTheo={}; (M.months||[]).forEach(m=>thatTheo[m.thang]=m.clicks);
  const phu = thangs.map(t=>{
    const bang=rows.filter(r=>r.thang===t).reduce((a,r)=>a+r.c,0);
    const that=thatTheo[t]??null;
    return {thang:t, bang, that, tyle: (that? bang/that : null),
            khuyet: (M.months||[]).find(m=>m.thang===t)?.partial===true};
  });
  M._qm = {rows, thangs, phu, coLuat: lCd.length>0 && lYd.length>0,
           soLuat: lCd.length+lYd.length};
  return M._qm;
}

/* Gộp theo một chiều (cd hoặc yd), có thể lọc theo tháng */
function gopTheo(rows, key){
  const m=new Map();
  rows.forEach(r=>{
    if(!m.has(r[key])) m.set(r[key],{k:r[key],c:0,i:0,dong:0,q:new Set()});
    const o=m.get(r[key]); o.c+=r.c; o.i+=r.i; o.dong++; o.q.add(r.q);
  });
  /* n = số truy vấn KHÁC NHAU, không phải số dòng.
     Mỗi truy vấn xuất hiện ở nhiều tháng thì có nhiều dòng — đếm dòng sẽ thổi phồng số. */
  return [...m.values()].map(o=>({...o, n:o.q.size, ctr:o.i?o.c/o.i:null}))
    .sort((a,b)=>b.c-a.c);
}

/* Thanh xếp chồng theo tháng — dựng bằng div, không phụ thuộc SVG */
/* ĐỔI TÊN: dashboard đã có sẵn stackBar(o) ở phần 4, trùng tên là ghi đè mất bản gốc */
function cotXepThang(thangs, rows, key, thuTu, mau){
  const tong={}; thangs.forEach(t=>tong[t]=0);
  const o={}; thuTu.forEach(k=>o[k]={});
  rows.forEach(r=>{ if(o[r[key]]){ o[r[key]][r.thang]=(o[r[key]][r.thang]||0)+r.c; tong[r.thang]+=r.c; } });
  let h=`<div style="display:flex;gap:3px;align-items:flex-end;height:150px;padding:6px 0">`;
  thangs.forEach(t=>{
    h+=`<div style="flex:1;display:flex;flex-direction:column-reverse;height:100%;min-width:0" title="${esc(t)} — ${fi(tong[t])} click">`;
    thuTu.forEach((k,idx)=>{
      const v=o[k][t]||0; const pct= tong[t]? v/tong[t]*100 : 0;
      if(pct>0) h+=`<div style="height:${pct.toFixed(1)}%;background:${mau[idx]}" title="${esc(t)} · ${esc(k)}: ${fi(v)} click (${nf1.format(pct)}%)"></div>`;
    });
    h+=`</div>`;
  });
  h+=`</div><div style="display:flex;gap:3px;font-size:10px;color:var(--faint)">`;
  thangs.forEach((t,i)=>{ h+=`<div style="flex:1;text-align:center;min-width:0;overflow:hidden">${i%2===0?esc(t.slice(2)):''}</div>`; });
  h+=`</div>`;
  return h;
}

/* ============================================================================
   TAB 6 — TRUY VẤN & Ý ĐỊNH
   ============================================================================ */
let q6Thang='', q6Yd='', q6Cd='';
function q6Set(kind, el, v){
  if(kind==='t') q6Thang=v; if(kind==='y') q6Yd=v; if(kind==='c') q6Cd=v;
  veBangQ6();
}
function veBangQ6(){
  const el=document.getElementById('q6-body'); if(!el) return;
  const Q=qmData();
  let rs=Q.rows;
  if(q6Thang) rs=rs.filter(r=>r.thang===q6Thang);
  if(q6Yd)    rs=rs.filter(r=>r.yd===q6Yd);
  if(q6Cd)    rs=rs.filter(r=>r.cd===q6Cd);
  /* gộp trùng truy vấn khi xem nhiều tháng */
  const m=new Map();
  rs.forEach(r=>{
    if(!m.has(r.q)) m.set(r.q,{q:r.q,c:0,i:0,pw:0,cd:r.cd,yd:r.yd,th:new Set()});
    const o=m.get(r.q); o.c+=r.c; o.i+=r.i; o.th.add(r.thang);
    if(r.pos!=null) o.pw+=r.pos*(r.i||1);
  });
  const list=[...m.values()].map(o=>({...o, ctr:o.i?o.c/o.i:null, pos:o.i?o.pw/o.i:null}))
    .sort((a,b)=>b.c-a.c);
  const tongC=list.reduce((a,r)=>a+r.c,0);
  const hienThi=list.slice(0,150);
  document.getElementById('q6-meta').innerHTML =
    `${fi(list.length)} truy vấn · ${fi(tongC)} click · hiển thị ${fi(hienThi.length)} dòng đầu`;
  el.innerHTML = hienThi.map((r,i)=>
    `<tr><td class="r" style="color:var(--faint)">${i+1}</td>
      <td class="tt2">${esc(r.q)}</td>
      <td style="white-space:nowrap;font-size:11px">${esc(r.yd)}</td>
      <td style="white-space:nowrap;font-size:11px">${esc(r.cd)}</td>
      <td class="r" data-v="${r.c}"><b>${fi(r.c)}</b></td>
      <td class="r" data-v="${r.i}">${fi(r.i)}</td>
      <td class="r" data-v="${r.ctr||0}">${fp(r.ctr)}</td>
      <td class="r" data-v="${r.pos==null?999:r.pos}">${f1(r.pos)}</td>
      <td class="r" data-v="${r.th.size}">${r.th.size}</td></tr>`).join('')
    || `<tr><td colspan="9" style="padding:14px;color:var(--muted)">Không có dòng nào khớp bộ lọc.</td></tr>`;
}

    <div class="tw"><table id="tb-q6"><thead><tr><th>#</th>${th('Truy vấn','s')}<th>Ý định</th><th>Chủ đề</th>
      ${th('Click','n','r')}${th('Hiển thị','n','r')}${th('CTR','n','r')}${th('Vị trí','n','r')}${th('Số tháng','n','r')}
      </tr></thead><tbody id="q6-body"></tbody></table></div>
    <div class="src" style="margin-top:8px">Bấm tiêu đề cột để sắp xếp. Cột “Số tháng” cho biết truy vấn xuất hiện ở bao nhiêu tháng —
      xuất hiện 1 tháng thường là tin tức nhất thời, xuất hiện đều nhiều tháng mới là nhu cầu ổn định.</div>
  </div>`;

  /* ---------- độ phủ theo tháng ---------- */
  h+=`<div class="sec"><div class="sec-h"><h3>Bảng truy vấn giải thích được bao nhiêu phần click, theo tháng</h3>
      <span class="src">đối chiếu ${srcLink('GSC_MONTHLY')}</span></div>
    <div class="tw"><table><thead><tr><th>Tháng</th><th class="r">Click thật</th><th class="r">Bảng truy vấn</th>
      <th class="r">Phủ</th><th>Ghi chú</th></tr></thead><tbody>`;
  Q.phu.forEach(p=>{
    h+=`<tr><td class="mono">${esc(p.thang)}</td>
      <td class="r">${p.that==null?'—':fi(p.that)}</td>
      <td class="r">${fi(p.bang)}</td>
      <td class="r">${fp(p.tyle,1)}</td>
      <td>${p.khuyet?'<span class="bd bd-md">tháng khuyết ngày — không so ngang</span>':''}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;
  return h;
}
</script>

<script>
/* ============================================================================
   12 · ĐIỀU PHỐI
   ============================================================================ */
function buildTabs(){
  document.getElementById('tabbar').innerHTML = TABS.map(t=>
    `<button class="tab" role="tab" id="t-${t.id}" aria-selected="${t.id===S.tab}"
       aria-controls="p-${t.id}" onclick="go(${t.id})"><span class="n">${t.n}</span>${t.t}</button>`).join('');
}
function go(i, keepScroll){
  S.tab=i;
  TABS.forEach(t=>{
    const b=document.getElementById('t-'+t.id), p=document.getElementById('p-'+t.id);
    if(b) b.setAttribute('aria-selected', t.id===i);
    if(p) p.hidden = t.id!==i;
  });
  location.hash='tab'+i;
  if(!keepScroll) window.scrollTo({top:0, behavior:'instant'});
}
function initFilters(){
  // nút "Đang mở" của bảng vấn đề đang ở trạng thái bật -> phải lọc thật
  const tb=document.getElementById('tb-iss');
  if(tb) [...tb.tBodies[0].rows].forEach(r=>{ r.style.display = r.dataset.open==='1'?'':'none'; });
  kwFilterGrp=''; filterKw();
  try{ veBangQ6(); }catch(e){ console.error('bảng truy vấn theo tháng:',e); }
}
function render(keepScroll){
  const fns={0:tab0,1:tab1,2:tab2,3:tab3,4:tab4,5:tab5,6:tab6};
  Object.entries(fns).forEach(([i,fn])=>{
    const el=document.getElementById('p-'+i);
    try{ el.innerHTML=fn(); }
    catch(e){ el.innerHTML=`<div class="card card-p">${note('down','✖',`Lỗi dựng tab ${i}: ${esc(e.message)}`)}</div>`; console.error(e); }
  });
  anonFill();
  initFilters();
  document.getElementById('foot').innerHTML =
    `<b>Nguồn:</b> Google Sheet <span class="mono">${SHEET_ID.slice(0,12)}…</span> ·
     <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit" target="_blank" rel="noopener">mở bảng gốc ↗</a> ·
     dữ liệu Search Console đến ${M.lastDay?dvn(M.lastDay):'—'} ·
     dashboard đọc lúc ${S.loadedAt||'—'}.<br>
     <b>Cách đọc:</b> click của Search Console là thước đo chính thức. Thứ hạng, ước lượng traffic Ahrefs và số nhập tay chỉ để đối chiếu.
     Ô trống nghĩa là không có dữ liệu, không phải số 0.`;
  go(S.tab, keepScroll);
}
async function loadAll(bust){
  const btn=document.getElementById('btn-refresh');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Đang tải'; }
  S.err=[];
  const names=Object.keys(GID);
  let done=0;
  const msg=document.getElementById('boot-msg');
  await Promise.all(names.map(async n=>{
    D[n]=await fetchTab(n, GID[n], bust);
    done++;
    if(msg) msg.textContent=`${done}/${names.length} tab`;
  }));
  M._qm=null;            // dữ liệu mới -> bỏ bộ nhớ đệm phân loại
  prep();
  S.loadedAt=new Date().toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'});
  const boot=document.getElementById('boot'); if(boot) boot.style.display='none';
  const pill=document.getElementById('pill-data');
  if(S.err.length){
    const b=document.getElementById('boot');
    if(b){ b.style.display='block'; b.innerHTML=`<div class="note n-down"><span class="ic">✖</span><div><b>Không đọc được ${S.err.length} tab:</b> ${S.err.map(esc).join(', ')}.<br>Kiểm tra Google Sheet đang chia sẻ ở mức “bất kỳ ai có đường liên kết → người xem”, rồi bấm Làm mới.</div></div>`; }
  }
  if(pill) pill.innerHTML = M.lastDay
    ? `Số liệu đến <b>${dvn(M.lastDay)}</b> · đọc lúc ${S.loadedAt}`
    : `<b>Không đọc được dữ liệu</b>`;
  render();
  if(btn){ btn.disabled=false; btn.textContent='Làm mới'; }
}
buildTabs();
const hm=/tab(\d)/.exec(location.hash); if(hm) S.tab=+hm[1];
loadAll(false);
</script>
</body>
