<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Báo cáo SEO/GEO — Timona Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TIMONA SEO DASHBOARD — bảng màu thương hiệu
   navy #0F3F76 · xanh sáng #2483C5 · chữ #231F20
   ============================================================ */
:root{
  --navy:#0F3F76; --navy-d:#0A2C53; --navy-l:#1B558F;
  --blue:#2483C5; --blue-l:#5BA6DC; --blue-xl:#E8F1F9;
  --ink:#231F20; --muted:#5F6B7A; --faint:#8A94A2;
  --paper:#F4F6F9; --card:#FFFFFF; --line:#E1E7EF; --line-d:#C9D3E0;
  --up:#12805C; --up-bg:#E6F4EF;
  --down:#C0392B; --down-bg:#FBEAE8;
  --warn:#B7791F; --warn-bg:#FDF4E3;
  --r:10px; --r-s:6px;
  --sh:0 1px 2px rgba(16,40,73,.06), 0 4px 14px rgba(16,40,73,.05);
  --f: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --fm: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f); color:var(--ink); background:var(--paper);
  font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.015em; line-height:1.25}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:3px}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ---------- TOPBAR ---------- */
.top{
  background:var(--navy); color:#fff; position:sticky; top:0; z-index:50;
  box-shadow:0 1px 0 rgba(255,255,255,.08), 0 6px 20px rgba(10,44,83,.18);
}
.top-in{max-width:1500px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand img{height:34px; width:auto; display:block}
.brand-t{min-width:0}
.brand-t h1{font-size:16px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand-t p{margin:1px 0 0; font-size:11.5px; color:#A9C6E4; font-weight:500}
.top-r{margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.datepill{
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18);
  padding:5px 11px; border-radius:99px; font-size:12px; color:#DCE9F6; font-weight:500;
}
.datepill b{color:#fff; font-weight:700}
.btn{
  font-family:var(--f); font-size:12.5px; font-weight:600; cursor:pointer;
  border-radius:var(--r-s); padding:7px 13px; border:1px solid transparent; transition:.15s;
}
.btn-r{background:var(--blue); color:#fff; border-color:var(--blue-l)}
.btn-r:hover{background:var(--blue-l)}
.btn-r:disabled{opacity:.55; cursor:progress}
.btn-g{background:#fff; color:var(--navy); border-color:var(--line-d)}
.btn-g:hover{background:var(--blue-xl)}

/* ---------- NAV ---------- */
.nav{background:var(--navy-d); position:sticky; top:59px; z-index:49}
.nav-in{max-width:1500px; margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.tab{
  background:none; border:0; font-family:var(--f); font-size:13px; font-weight:600;
  color:#9FBEDD; padding:11px 15px; cursor:pointer; white-space:nowrap;
  border-bottom:3px solid transparent; transition:.15s; display:flex; align-items:center; gap:7px;
}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff; border-bottom-color:var(--blue)}
.tab .n{
  font-size:10.5px; font-weight:700; background:rgba(255,255,255,.14);
  padding:1px 6px; border-radius:99px; color:#CFE2F3;
}
.tab[aria-selected="true"] .n{background:var(--blue); color:#fff}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1500px; margin:0 auto; padding:22px 20px 70px}
.panel[hidden]{display:none}
.sec{margin-bottom:26px}
.sec-h{display:flex; align-items:baseline; gap:12px; margin-bottom:11px; flex-wrap:wrap}
.sec-h h2{font-size:17px}
.sec-h h3{font-size:15px}
.eyebrow{
  font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:var(--blue); background:var(--blue-xl); padding:3px 8px; border-radius:4px;
}
.sec-h .src{margin-left:auto; font-size:11.5px; color:var(--faint); font-weight:500; display:flex; gap:8px; align-items:center}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh)}
.card-p{padding:16px 18px}
.grid{display:grid; gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2,.g21{grid-template-columns:1fr}}
@media(max-width:620px){.g4{grid-template-columns:1fr}}

/* ---------- KPI ---------- */
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; box-shadow:var(--sh); position:relative; overflow:hidden}
.kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--blue)}
.kpi.k-warn::before{background:var(--warn)} .kpi.k-down::before{background:var(--down)} .kpi.k-up::before{background:var(--up)}
.kpi .lab{font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.045em; display:flex; align-items:center; gap:6px}
.kpi .val{font-size:29px; font-weight:800; letter-spacing:-.03em; margin:5px 0 2px; color:var(--navy); line-height:1.1}
.kpi .val small{font-size:15px; font-weight:600; color:var(--muted); letter-spacing:0}
.kpi .sub{font-size:12px; color:var(--faint); font-weight:500}
.chip{display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:700; padding:2px 7px; border-radius:99px; font-variant-numeric:tabular-nums}
.chip-up{background:var(--up-bg); color:var(--up)}
.chip-down{background:var(--down-bg); color:var(--down)}
.chip-flat{background:#EEF1F5; color:var(--muted)}

/* ---------- NOTE / BANNER ---------- */
.mb:empty,.sec:empty{display:none;margin:0;padding:0}
.note{border-radius:var(--r-s); padding:11px 14px; font-size:13px; display:flex; gap:10px; align-items:flex-start; line-height:1.5}
.note b{font-weight:700}
.note .ic{font-size:15px; line-height:1.35; flex:none}
.n-warn{background:var(--warn-bg); border:1px solid #F0DCB4; color:#7A5410}
.n-down{background:var(--down-bg); border:1px solid #F3CFCB; color:#8E2A20}
.n-info{background:var(--blue-xl); border:1px solid #C6DDF0; color:#134A75}
.n-mut{background:#F1F4F8; border:1px solid var(--line); color:var(--muted)}
.mb{margin-bottom:12px}

/* ---------- TABLE ---------- */
.tw{overflow-x:auto; border-radius:var(--r); border:1px solid var(--line); background:var(--card); box-shadow:var(--sh)}
table{border-collapse:collapse; width:100%; font-size:13px}
thead th{
  background:#F7F9FC; color:var(--muted); font-weight:700; font-size:11px; letter-spacing:.05em;
  text-transform:uppercase; text-align:left; padding:9px 11px; border-bottom:1.5px solid var(--line-d);
  white-space:nowrap; position:sticky; top:0;
}
th.s{cursor:pointer; user-select:none}
th.s:hover{color:var(--blue)}
th.s::after{content:"↕"; opacity:.35; margin-left:4px; font-size:10px}
th.s.asc::after{content:"↑"; opacity:1; color:var(--blue)}
th.s.desc::after{content:"↓"; opacity:1; color:var(--blue)}
tbody td{padding:8px 11px; border-bottom:1px solid #EEF1F6; vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFCFE}
.r{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.c{text-align:center}
.tt{max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tt2{max-width:520px}
.mono{font-family:var(--fm); font-size:11.5px}
.bar-cell{position:relative}
.bar-cell .bg{position:absolute; right:0; top:3px; bottom:3px; background:var(--blue-xl); border-radius:2px; z-index:0}
.bar-cell span{position:relative; z-index:1}

/* ---------- BADGE ---------- */
.bd{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:4px; white-space:nowrap; letter-spacing:.02em}
.bd-tm{background:#E7F3EC; color:#12805C}
.bd-hp{background:#EDE9FB; color:#5B3FBF}
.bd-bl{background:#F0F2F5; color:#5F6B7A}
.bd-hi{background:var(--down-bg); color:var(--down)}
.bd-md{background:var(--warn-bg); color:var(--warn)}
.bd-lo{background:#EEF1F5; color:var(--muted)}
.bd-ok{background:var(--up-bg); color:var(--up)}
.bd-bn{background:var(--blue-xl); color:#134A75}

/* ---------- MISC ---------- */
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); font-weight:500; margin-top:8px}
.legend i{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.cap{font-size:11.5px; color:var(--faint); margin-top:7px; line-height:1.5}
.ctl{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:11px}
select,input[type=search]{
  font-family:var(--f); font-size:12.5px; padding:6px 9px; border:1px solid var(--line-d);
  border-radius:var(--r-s); background:#fff; color:var(--ink); max-width:100%;
}
.seg{display:inline-flex; border:1px solid var(--line-d); border-radius:var(--r-s); overflow:hidden; background:#fff}
.seg button{
  font-family:var(--f); font-size:12px; font-weight:600; padding:6px 12px; border:0;
  background:#fff; color:var(--muted); cursor:pointer; border-right:1px solid var(--line)
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy); color:#fff}
.empty{padding:30px 18px; text-align:center; color:var(--faint); font-size:13px}
.empty>b:first-child{display:block; color:var(--muted); font-size:14px; margin-bottom:5px; font-weight:700}
.empty>div{max-width:60ch; margin:0 auto; text-align:left}
.spin{display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart text{font-family:var(--f)}
.cwrap{width:100%}
@media(max-width:760px){
  .cwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px}
  .cwrap>.chart{min-width:640px}
  .cwrap::after{content:"↔ vuốt ngang để xem hết biểu đồ"; display:block; font-size:11px; color:var(--faint); padding-top:4px}
  .para .cwrap::after{color:#8FAECD}
}

/* ---------- SIGNATURE: BĂNG NGHỊCH LÝ ---------- */
.para{
  background:linear-gradient(160deg,var(--navy) 0%, var(--navy-d) 100%);
  border-radius:var(--r); padding:20px 22px 16px; color:#fff; box-shadow:0 8px 26px rgba(10,44,83,.22);
}
.para-h{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px}
.para-h .lead{flex:1; min-width:260px}
.para-h .eyebrow{background:rgba(255,255,255,.13); color:#8FC2E9}
.para-h h2{color:#fff; font-size:19px; margin-top:8px; letter-spacing:-.02em}
.para-h p{margin:6px 0 0; font-size:13px; color:#B9D3EA; max-width:62ch; line-height:1.55}
.para-stat{display:flex; gap:22px; flex-wrap:wrap}
.para-stat div{min-width:88px}
.para-stat .v{font-size:23px; font-weight:800; letter-spacing:-.03em; line-height:1.15}
.para-stat .l{font-size:10.5px; color:#8FAECD; font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-top:1px}
.para-stat .v.dn{color:#FF9E93} .para-stat .v.up{color:#7FE3B8}
.para-box{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:var(--r-s); padding:12px 14px}
.para-box .chart text{fill:#B9D3EA}
.para-note{margin-top:11px; font-size:12px; color:#A9C6E4; line-height:1.55; border-top:1px solid rgba(255,255,255,.12); padding-top:10px}
.para-note b{color:#fff}

/* ---------- FOOTER ---------- */
.foot{border-top:1px solid var(--line); margin-top:34px; padding:16px 0 0; font-size:11.5px; color:var(--faint); line-height:1.6}
.foot b{color:var(--muted)}

@media print{
  .top,.nav,.ctl,.btn{display:none!important}
  .panel[hidden]{display:block!important}
  body{background:#fff; font-size:11px}
  .card,.tw,.kpi{box-shadow:none; break-inside:avoid}
  .para{background:var(--navy)!important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <img src="https://timona.edu.vn/wp-content/uploads/2025/12/Logo_Timona_web-1.png" alt="Timona Academy" onerror="this.style.display='none'">
      <div class="brand-t">
        <h1>Báo cáo SEO/GEO — Timona Academy</h1>
        <p>Google Search Console · Ahrefs · số nhập tay</p>
      </div>
    </div>
    <div class="top-r">
      <span class="datepill" id="pill-data">Đang tải dữ liệu…</span>
      <button class="btn btn-g" onclick="window.print()">In / lưu PDF</button>
      <button class="btn btn-r" id="btn-refresh" onclick="loadAll(true)">Làm mới</button>
    </div>
  </div>
</header>

<nav class="nav">
  <div class="nav-in" role="tablist" id="tabbar"></div>
</nav>

<main class="wrap">
  <div id="boot" class="card card-p" style="text-align:center; padding:50px 20px">
    <div style="font-size:15px; font-weight:700; color:var(--navy)">Đang đọc Google Sheet…</div>
    <div id="boot-msg" style="font-size:12.5px; color:var(--muted); margin-top:6px">16 tab dữ liệu</div>
  </div>
  <section class="panel" id="p-0" role="tabpanel" hidden></section>
  <section class="panel" id="p-1" role="tabpanel" hidden></section>
  <section class="panel" id="p-2" role="tabpanel" hidden></section>
  <section class="panel" id="p-3" role="tabpanel" hidden></section>
  <section class="panel" id="p-4" role="tabpanel" hidden></section>
  <section class="panel" id="p-6" role="tabpanel" hidden></section>
  <section class="panel" id="p-5" role="tabpanel" hidden></section>

  <div class="foot" id="foot"></div>
</main>

<script>
/* ============================================================================
   0 · CẤU HÌNH
   ============================================================================ */
const SHEET_ID = '1mdHGUuDU1Y6SrdFviRHbwPgbBipvix-442awmztPfkc';
const GID = {
  CONFIG:'147570048', CLASSIFY_RULES:'1268551812', UPDATE_LOG:'843323452',
  GSC_DAILY:'309170980', GSC_MONTHLY:'579100357', GSC_SEGMENT:'870497833',
  GSC_QUERY:'1199678687', GSC_PAGE:'1772340298',
  KEYWORD_MASTER:'580417143', KEYWORD_RANK_WEEKLY:'165606809',
  AHREFS_KPI:'1681573242', AI_RESPONSES:'379237336', SITE_ISSUES:'1118437563',
  AI_RANK_LOG:'1522076847', USP_CHECKLIST:'540045851', USP_CHECK_LOG:'921116997',
  GA4_DAILY:'1007936838',
  GA4_EVENT:'1429719912', GA4_CHANNEL:'1933458138', PAGE_META:'286215411',
  GSC_QUERY_MONTHLY:'1616632813',
  LEAD:'1456998018',  // dữ liệu form đăng ký, đổ vào sau
  KEYWORD_RANK_SERP:'666131142'   // quét SERP điểm-thời-gian bằng SpinEditor, nhập tay 2 lần/tháng
};
/* Cột bắt buộc của mỗi tab. Dùng để chặn một cái bẫy của Google:
   gọi gviz với tên tab không tồn tại thì nó trả về tab ĐẦU TIÊN kèm mã 200,
   không hề báo lỗi. Không kiểm cột thì dashboard sẽ nuốt nhầm dữ liệu tab khác. */
const COT_BUOC = { GA4_DAILY:['ngay','sessions'], LEAD:['ngay'],
  GA4_EVENT:['ten_su_kien'], GA4_CHANNEL:['thang','nguon'],
  PAGE_META:['url','tieu_de'], GSC_QUERY_MONTHLY:['thang','query'] };
const TABS = [
  {id:0,n:'0',t:'Tổng quan'},
  {id:1,n:'1',t:'Traffic'},
  {id:2,n:'2',t:'Từ khoá'},
  {id:3,n:'3',t:'Chất lượng traffic'},
  {id:4,n:'4',t:'AI / GEO'},
  {id:6,n:'6',t:'Truy vấn & Ý định'},
  {id:5,n:'5',t:'Vấn đề & nhật ký'}
];
/* Báo cáo chỉ hiển thị 6 tháng gần nhất. Chuỗi dài hơn làm cột biểu đồ mỏng
   và bảng dài, sếp phải cuộn mới đọc được. Dữ liệu cũ vẫn nằm nguyên trong Sheet. */
const SO_THANG = 6;
const CO = {navy:'#0F3F76', blue:'#2483C5', blueL:'#5BA6DC', up:'#12805C', down:'#C0392B', warn:'#B7791F', line:'#E1E7EF', muted:'#5F6B7A', faint:'#8A94A2'};
const D = {};              // dữ liệu thô theo tab
const S = {tab:0, loadedAt:null, err:[]};   // trạng thái

/* ============================================================================
   1 · ĐỌC CSV
   ============================================================================ */
function parseCSV(txt){
  const rows=[]; let f='', row=[], q=false;
  txt = txt.replace(/^\uFEFF/,'');
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){
      if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(f); f=''; }
      else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else if(c==='\r'){ /* bỏ */ }
      else f+=c;
    }
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  if(!rows.length) return [];
  const head = rows[0].map(h=>h.trim());
  const out = rows.slice(1)
    .filter(r=>r.some(v=>String(v).trim()!==''))
    .map(r=>{ const o={}; head.forEach((h,i)=>o[h]=(r[i]??'').trim()); return o; });
  out.cot = head;              // giữ lại tên cột, vì tab chỉ có header sẽ ra mảng rỗng
  return out;
}

function ngPhu(bust){ return bust ? '&_nc='+Date.now() : ''; }
const B = `https://docs.google.com/spreadsheets/d/${SHEET_ID}`;

/* headers=1 là BẮT BUỘC. Không có nó, Google tự đoán xem mấy dòng đầu là tiêu đề,
   và đoán sai với tab toàn chữ: tab CONFIG từng bị gộp 3 dòng đầu thành một dòng
   tiêu đề "key site_url gsc_property", nuốt mất 2 dòng dữ liệu mà không báo gì. */
async function fetchTab(name, gid, bust){
  const ds = [];
  if(gid) ds.push(`${B}/gviz/tq?tqx=out:csv&headers=1&gid=${gid}${ngPhu(bust)}`);
  ds.push(`${B}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}${ngPhu(bust)}`);
  if(gid) ds.push(`${B}/export?format=csv&gid=${gid}${ngPhu(bust)}`);

  for(const u of ds){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if(!r.ok) continue;
      const t = await r.text();
      if(t.trim().startsWith('<')) continue;          // trang lỗi HTML
      if(!t.trim()) continue;
      const rows = parseCSV(t);
      const cot = rows.cot || [];
      if(!cot.length) continue;
      const buoc = COT_BUOC[name];
      if(buoc && !buoc.every(c => cot.indexOf(c) > -1)) continue;   // nhầm sang tab khác
      return rows;               // mảng rỗng vẫn hợp lệ: tab có cột nhưng chưa có dòng nào
    }catch(e){ /* thử địa chỉ kế */ }
  }
  if(!TAB_TUY_CHON.has(name)) S.err.push(name);
  return [];
}
/* Tab chưa chắc tồn tại — không đọc được thì bỏ qua lặng lẽ, không báo lỗi đỏ. */
const TAB_TUY_CHON = new Set(['GA4_DAILY','LEAD','KEYWORD_RANK_SERP']);

/* ============================================================================
   2 · ĐỌC SỐ — Sheet đang để ngôn ngữ Việt: "." ngăn nghìn, "," thập phân
   ============================================================================ */
function toInt(v){
  if(v==null) return null;
  const s=String(v).replace(/[^\d\-]/g,'');
  if(s===''||s==='-') return null;
  const n=parseInt(s,10); return isNaN(n)?null:n;
}
function toFloat(v){
  if(v==null) return null;
  let s=String(v).trim().replace(/%/g,'').replace(/\s/g,'');
  if(s==='') return null;
  const lc=s.lastIndexOf(','), ld=s.lastIndexOf('.');
  if(lc>-1 && ld>-1){ s = lc>ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(lc>-1){ s = s.replace(/\./g,'').replace(',','.'); }
  const n=parseFloat(s); return isNaN(n)?null:n;
}
function toRate(v){                       // trả về phân số: 0,0148 = 1,48%
  if(v==null||String(v).trim()==='') return null;
  const pct=String(v).includes('%');
  const n=toFloat(v);
  if(n==null) return null;
  return pct ? n/100 : n;
}

/* ---- định dạng hiển thị ---- */
const nf0=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2=new Intl.NumberFormat('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fi = n => (n==null||isNaN(n)) ? '—' : nf0.format(n);
const f1 = n => (n==null||isNaN(n)) ? '—' : nf1.format(n);
const nfp0=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0});
const fp = (n,d=2) => (n==null||isNaN(n)) ? '—' : (d===0?nfp0:d===1?nf1:nf2).format(n*100)+'%';
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dOnly(s){ return String(s||'').slice(0,10); }
function dvn(s){ const p=dOnly(s).split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : (s||'—'); }
function dayNum(s){ const t=Date.parse(dOnly(s)+'T00:00:00Z'); return isNaN(t)?null:Math.round(t/86400000); }
function addDays(s,k){ const d=new Date(Date.parse(dOnly(s)+'T00:00:00Z')+k*86400000); return d.toISOString().slice(0,10); }
function today(){ return new Date().toISOString().slice(0,10); }

/* so kỳ: hướng tốt = 'up' (càng cao càng tốt) hoặc 'down' (càng thấp càng tốt) */
function delta(cur, prev, better='up'){
  if(cur==null||prev==null||prev===0) return {html:'<span class="chip chip-flat">—</span>', dir:0};
  const p=(cur-prev)/Math.abs(prev);
  const good = better==='up' ? p>0 : p<0;
  const flat = Math.abs(p)<0.005;
  const cls = flat?'chip-flat':(good?'chip-up':'chip-down');
  const sign = p>0?'+':'';
  return {
    html:`<span class="chip ${cls}">${sign}${nf1.format(p*100)}%</span>`,
    dir: flat?0:(good?1:-1), pct:p
  };
}
</script>
<script>
/* ============================================================================
   3 · BIỂU ĐỒ SVG (không thư viện ngoài)
   ============================================================================ */
function scale(dmin,dmax,rmin,rmax){
  const d=(dmax-dmin)||1;
  return v => rmin + (v-dmin)/d*(rmax-rmin);
}
function niceStep(v){
  if(!v||v<=0) return 1;
  const e=Math.pow(10,Math.floor(Math.log10(v))), n=v/e;
  const m = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return m*e;
}
/* trả về trần chia hết cho 4 mức lưới, để nhãn trục luôn là số tròn */
function niceMax(v, ticks){
  if(!v||v<=0) return 1;
  const t=ticks||4;
  return niceStep(v/t)*t;
}
/* Biểu đồ kết hợp: cột + tối đa 2 đường, có trục phải, trục phải có thể đảo chiều */
function comboChart(o){
  const W=o.w||880, H=o.h||270, ml=o.ml||46, mr=o.mr||46, mt=18, mb=o.mb||34;
  const iw=W-ml-mr, ih=H-mt-mb, n=o.labels.length;
  if(!n) return '<div class="empty">Không có dữ liệu</div>';
  const dark = !!o.dark;
  const axc = dark?'rgba(255,255,255,.22)':CO.line;
  const txc = dark?'#B9D3EA':CO.faint;
  const bw = Math.max(2, Math.min(30, iw/n*0.62));
  const cx = i => ml + iw*(i+0.5)/n;

  const bmax = niceMax(Math.max(...o.bars.filter(v=>v!=null), 0));
  const y1 = scale(0,bmax, mt+ih, mt);
  let rmin=0, rmax=1, y2=null;
  if(o.line){
    const vals=o.line.data.filter(v=>v!=null);
    if(vals.length){
      rmax = o.line.max!=null?o.line.max:niceMax(Math.max(...vals));
      rmin = o.line.min!=null?o.line.min:0;
      y2 = o.line.invert ? scale(rmin,rmax, mt, mt+ih) : scale(rmin,rmax, mt+ih, mt);
    }
  }
  let s=`<div class="cwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'biểu đồ')}">`;
  // lưới ngang + trục trái
  for(let g=0; g<=4; g++){
    const v=bmax*g/4, y=y1(v);
    s+=`<line x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}" stroke="${axc}" stroke-width="1"${g?' stroke-dasharray="2 4"':''}/>`;
    s+=`<text x="${ml-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="${txc}">${fi(Math.round(v))}</text>`;
  }
  // trục phải
  if(y2){
    for(let g=0; g<=4; g++){
      const v=rmin+(rmax-rmin)*g/4;
      s+=`<text x="${W-mr+7}" y="${(y2(v)+3.5).toFixed(1)}" text-anchor="start" font-size="10" fill="${o.line.color||CO.blue}">${o.line.fmt?o.line.fmt(v):f1(v)}</text>`;
    }
  }
  // cột
  o.bars.forEach((v,i)=>{
    if(v==null) return;
    const x=cx(i)-bw/2, y=y1(v), h=Math.max(0, mt+ih-y);
    const c = (o.barColors&&o.barColors[i]) || o.barColor || CO.blue;
    const op = (o.barOpacity&&o.barOpacity[i]!=null) ? o.barOpacity[i] : 1;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" opacity="${op}" rx="2"><title>${esc(o.labels[i])}: ${fi(v)}${o.barUnit||''}</title></rect>`;
  });
  // đường
  if(y2){
    const pts=[]; o.line.data.forEach((v,i)=>{ if(v!=null) pts.push([cx(i), y2(v)]); });
    if(pts.length>1){
      const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
      s+=`<path d="${d}" fill="none" stroke="${o.line.color||CO.warn}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    o.line.data.forEach((v,i)=>{ if(v==null) return;
      s+=`<circle cx="${cx(i).toFixed(1)}" cy="${y2(v).toFixed(1)}" r="2.6" fill="${o.line.color||CO.warn}"><title>${esc(o.labels[i])}: ${o.line.fmt?o.line.fmt(v):f1(v)}</title></circle>`;
    });
  }
  // nhãn trục X
  const step = Math.ceil(n/(o.maxLabels||12));
  const shown=[];
  o.labels.forEach((l,i)=>{ if(i%step===0) shown.push(i); });
  const lastI=n-1;
  if(shown[shown.length-1]!==lastI){
    if(lastI-shown[shown.length-1] < step) shown.pop();   // tránh 2 nhãn dính nhau
    shown.push(lastI);
  }
  shown.forEach(i=>{
    s+=`<text x="${cx(i).toFixed(1)}" y="${H-mb+15}" text-anchor="middle" font-size="10" fill="${txc}">${esc(o.labels[i])}</text>`;
  });
  s+=`</svg></div>`;
  return s;
}
/* Cột ngang */
function hbarChart(o){
  const rowH=o.rowH||27, lw=o.lw||120, W=o.w||620, mr=o.mr||62;
  const n=o.items.length; if(!n) return '<div class="empty">Không có dữ liệu</div>';
  const H=n*rowH+8, iw=W-lw-mr;
  const max=Math.max(...o.items.map(d=>d.v||0),1);
  let s=`<div class="cwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'biểu đồ cột ngang')}">`;
  o.items.forEach((d,i)=>{
    const y=i*rowH+5, bh=rowH-11, w=Math.max(1.5, (d.v||0)/max*iw);
    s+=`<text x="${lw-8}" y="${y+bh/2+4}" text-anchor="end" font-size="11.5" font-weight="600" fill="${CO.navy}">${esc(d.k)}</text>`;
    s+=`<rect x="${lw}" y="${y}" width="${w.toFixed(1)}" height="${bh}" rx="3" fill="${d.c||o.color||CO.blue}"><title>${esc(d.k)}: ${fi(d.v)}</title></rect>`;
    s+=`<text x="${(lw+w+7).toFixed(1)}" y="${y+bh/2+4}" font-size="11.5" font-weight="700" fill="${CO.muted}">${d.t!=null?esc(d.t):fi(d.v)}</text>`;
  });
  return s+'</svg></div>';
}
/* Thanh xếp chồng 100% */
function stackBar(o){
  const W=o.w||780, H=o.h||34;
  const tot=o.items.reduce((a,b)=>a+(b.v||0),0);
  if(!tot) return '<div class="empty">Không có dữ liệu</div>';
  let x=0, s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'tỷ trọng')}">`;
  o.items.forEach(d=>{
    const w=(d.v||0)/tot*W;
    s+=`<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0,w).toFixed(1)}" height="${H}" fill="${d.c}"><title>${esc(d.k)}: ${fi(d.v)} (${nf1.format(d.v/tot*100)}%)</title></rect>`;
    if(w>52) s+=`<text x="${(x+w/2).toFixed(1)}" y="${H/2+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${nf1.format(d.v/tot*100)}%</text>`;
    x+=w;
  });
  return s+'</svg>';
}

/* Năm bậc thứ hạng, đậm dần theo độ tốt. Dùng chung cho biểu đồ và bảng. */
const BAC_RANK = [
  {k:'k13',   ten:'1–3',    c:'#0F3F76'},
  {k:'k410',  ten:'4–10',   c:'#2483C5'},
  {k:'k1120', ten:'11–20',  c:'#5BA6DC'},
  {k:'k2150', ten:'21–50',  c:'#9CC8E8'},
  {k:'k51100',ten:'51–100', c:'#D3E5F3'}
];
/* Cột xếp chồng theo GIÁ TRỊ TUYỆT ĐỐI, không phải 100%.
   Cố ý không quy về phần trăm: tổng số từ khoá đang rank thay đổi giữa các mốc,
   và chính sự thay đổi đó là thứ cần nhìn thấy. Quy về 100% sẽ giấu mất nó.
   Mốc nào khuyết bậc thì chỉ vẽ phần có số và đánh dấu, không suy ra số thiếu. */
function cotBacAhrefs(moc){
  if(!moc.length) return '<div class="empty">Chưa có mốc nào có phân bố bậc</div>';
  const W=760, H=250, ml=44, mr=12, mt=14, mb=46;
  const iw=W-ml-mr, ih=H-mt-mb;
  const tong = m => BAC_RANK.reduce((a,b)=>a+(m[b.k]||0),0);
  const max = Math.max(...moc.map(tong), 1);
  const bw = Math.min(88, iw/moc.length*0.62);
  const cx = i => ml + iw*(i+0.5)/moc.length;
  let s=`<div class="cwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="phân bố bậc thứ hạng theo mốc">`;
  /* lưới ngang */
  for(let g=0; g<=4; g++){
    const v=max*g/4, y=mt+ih-ih*g/4;
    s+=`<line x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}" stroke="${CO.line}" stroke-width="1"/>`;
    s+=`<text x="${ml-7}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="${CO.faint}">${fi(Math.round(v))}</text>`;
  }
  moc.forEach((m,i)=>{
    const x=cx(i)-bw/2; let y=mt+ih; const t=tong(m);
    /* Cột khuyết bậc vẽ mờ đi: người xem liếc qua là biết ngay cột này chưa so
       ngang được với cột khác, không cần đọc chú thích mới hiểu. */
    const mo = m.thieu.length ? ' opacity="0.42"' : '';
    BAC_RANK.forEach(b=>{
      const v=m[b.k]||0; if(!v) return;
      const hh=v/max*ih; y-=hh;
      s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" fill="${b.c}"${mo}>
          <title>${esc(dvn(m.ngay))} · hạng ${b.ten}: ${fi(v)} từ khoá${m.thieu.length?` (mốc này còn khuyết bậc ${m.thieu.join(', ')})`:''}</title></rect>`;
      if(hh>15) s+=`<text x="${cx(i).toFixed(1)}" y="${(y+hh/2+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${b.k==='k13'||b.k==='k410'?'#fff':CO.navy}"${mo}>${fi(v)}</text>`;
    });
    if(m.thieu.length){
      /* khung nét đứt bao phần đã có, kèm dấu ? phía trên: phần còn thiếu không bịa ra chiều cao */
      s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(mt+ih-y).toFixed(1)}"
           fill="none" stroke="${CO.warn}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
      s+=`<text x="${cx(i).toFixed(1)}" y="${(y-19).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="${CO.warn}">?</text>`;
    }
    s+=`<text x="${cx(i).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${m.thieu.length?CO.faint:CO.navy}">${fi(t)}${m.thieu.length?'*':''}</text>`;
    s+=`<text x="${cx(i).toFixed(1)}" y="${H-mb+17}" text-anchor="middle" font-size="10.5" fill="${CO.muted}">${esc(dvn(m.ngay))}</text>`;
    if(m.thieu.length) s+=`<text x="${cx(i).toFixed(1)}" y="${H-mb+31}" text-anchor="middle" font-size="9.5" fill="${CO.warn}">thiếu ${m.thieu.length} bậc</text>`;
  });
  s+=`</svg></div><div style="display:flex;flex-wrap:wrap;gap:12px;padding:4px 0 2px">`;
  BAC_RANK.forEach(b=>{
    s+=`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5;color:var(--muted)">
        <span style="width:11px;height:11px;border-radius:2px;background:${b.c};display:inline-block"></span>hạng ${b.ten}</span>`;
  });
  return s+`</div>`;
}

<script>
/* ============================================================================
   4 · CHUẨN HOÁ + TÍNH TOÁN
   ============================================================================ */
const M = {};   // kết quả tính

function cfg(k){ const r=(D.CONFIG||[]).find(x=>x.key===k); return r? r.value : ''; }
/* Ô mục tiêu % có thể được gõ là "5", "5%" hoặc "0,05" — quy hết về phân số */
function pctCfg(k){
  const raw=cfg(k); if(!String(raw).trim()) return null;
  let n=toFloat(raw); if(n==null) return null;
  if(String(raw).includes('%')) n=n/100;
  else if(n>1) n=n/100;
  return (n>0 && n<=1) ? n : null;
}

function prep(){
  /* --- GSC_DAILY --- */
  M.daily = (D.GSC_DAILY||[]).map(r=>({
    ngay:dOnly(r.ngay), clicks:toInt(r.clicks)||0, impr:toInt(r.impressions)||0,
    ctr:toRate(r.ctr), pos:toFloat(r.position)
  })).filter(r=>r.ngay && /^\d{4}-\d{2}-\d{2}$/.test(r.ngay))
     .sort((a,b)=>a.ngay.localeCompare(b.ngay));
  M.lastDay = M.daily.length ? M.daily[M.daily.length-1].ngay : null;
  M.firstDay = M.daily.length ? M.daily[0].ngay : null;

  /* --- so kỳ N ngày (mặc định 28 theo CONFIG) --- */
  const N = toInt(cfg('so_ngay_ky_so_sanh')) || 28;
  M.N = N;
  M.periods = [];
  if(M.lastDay){
    for(let i=0;i<3;i++){
      const den = addDays(M.lastDay, -N*i), tu = addDays(den, -(N-1));
      const seg = M.daily.filter(d=>d.ngay>=tu && d.ngay<=den);
      const cl=seg.reduce((a,b)=>a+b.clicks,0), im=seg.reduce((a,b)=>a+b.impr,0);
      const pw=im? seg.reduce((a,b)=>a+(b.pos||0)*b.impr,0)/im : null;
      M.periods.push({tu,den,clicks:cl,impr:im,ctr:im?cl/im:null,pos:pw,days:seg.length});
    }
  }

  /* --- gộp tuần (mốc thứ Hai) --- */
  const wk=new Map();
  M.daily.forEach(d=>{
    const dt=new Date(d.ngay+'T00:00:00Z');
    const dow=(dt.getUTCDay()+6)%7;               // 0 = thứ Hai
    const k=addDays(d.ngay,-dow);
    if(!wk.has(k)) wk.set(k,{tu:k,clicks:0,impr:0,posw:0,days:0});
    const w=wk.get(k); w.clicks+=d.clicks; w.impr+=d.impr; w.posw+=(d.pos||0)*d.impr; w.days++;
  });
  M.weeks=[...wk.values()].sort((a,b)=>a.tu.localeCompare(b.tu)).map(w=>({
    ...w, den:addDays(w.tu,6), ctr:w.impr?w.clicks/w.impr:null, pos:w.impr?w.posw/w.impr:null, full:w.days===7
  }));

  /* --- GSC_MONTHLY --- */
  M.months = (D.GSC_MONTHLY||[]).map(r=>({
    thang:String(r.thang||'').slice(0,7), clicks:toInt(r.clicks), impr:toInt(r.impressions),
    ctr:toRate(r.ctr), pos:toFloat(r.position), days:toInt(r.so_ngay_du_lieu), ghi_chu:r.ghi_chu||''
  })).filter(r=>/^\d{4}-\d{2}$/.test(r.thang)).sort((a,b)=>a.thang.localeCompare(b.thang));
  // tháng khuyết = số ngày dữ liệu < số ngày thật của tháng
  M.months.forEach(m=>{
    const [y,mo]=m.thang.split('-').map(Number);
    const dim=new Date(Date.UTC(y,mo,0)).getUTCDate();
    m.dim=dim; m.partial = (m.days!=null && m.days<dim);
  });
  const done = M.months.filter(m=>!m.partial);
  M.peak = done.reduce((a,b)=> (!a||b.clicks>a.clicks)?b:a, null);
  M.firstFull = done.length? done[0] : null;          // mốc gốc — KHÔNG dùng tháng khuyết
  M.lastFull  = done.length? done[done.length-1] : null;
  M.dropPct = (M.peak&&M.lastFull&&M.peak.clicks) ? (M.lastFull.clicks-M.peak.clicks)/M.peak.clicks : null;

  /* --- kỳ của PAGE / QUERY / SEGMENT --- */
  M.pagePeriods  = groupPeriods(D.GSC_PAGE);
  M.queryPeriods = groupPeriods(D.GSC_QUERY);
  M.segPeriods   = groupPeriods(D.GSC_SEGMENT);
  M.selPage  = pickPeriod(M.pagePeriods);
  M.selQuery = pickPeriod(M.queryPeriods);
  M.selSeg   = pickPeriod(M.segPeriods);

  /* --- keyword --- */
  M.kw = (D.KEYWORD_MASTER||[]).map(r=>({
    id:r.kw_id, kw:r.tu_khoa, vol:toInt(r.volume)||0, chu_de:r.chu_de||'—',
    nhom:r.nhom_theo_doi||'—', intent:r.co_intent_hoc_nghe==='TRUE',
    url:r.url_muc_tieu||'', urlTop:r.url_top_thuc_te||'', dung:r.len_dung_link,
    ttUrl:r.trang_thai_url||'', hangChuan:toFloat(r.thu_hang_chuan),
    hangCu:toFloat(r.thu_hang_gan_nhat), mocCu:r.moc_rank_gan_nhat||'',
    theoDoi:r.dang_theo_doi==='TRUE', ghi:r.ghi_chu||''
  })).filter(r=>r.id);
  M.rankPeriods = groupPeriods(D.KEYWORD_RANK_WEEKLY);
  M.selRank = pickPeriod(M.rankPeriods);
  const rmap=new Map();
  (M.selRank?M.selRank.rows:[]).forEach(r=>{
    rmap.set(r.kw_id,{vi:toFloat(r.vi_tri), clicks:toInt(r.clicks), impr:toInt(r.impressions), url:r.url_xep_hang||''});
  });
  // kỳ liền trước (nếu đã có ≥2 tuần)
  const prevRank = M.rankPeriods.length>1 ? M.rankPeriods[1] : null;
  const pmap=new Map();
  if(prevRank) prevRank.rows.forEach(r=>pmap.set(r.kw_id, toFloat(r.vi_tri)));
  M.kw.forEach(k=>{
    const r=rmap.get(k.id);
    k.vi = r? r.vi : null; k.viClicks = r? r.clicks : null; k.viImpr = r? r.impr : null; k.viUrl = r? r.url : '';
    k.viPrev = prevRank ? (pmap.get(k.id) ?? null) : null;
  });
  M.hasPrevRank = !!prevRank;

  /* --- SERP điểm-thời-gian (SpinEditor, nhập tay) + đối chiếu chéo với Search Console --- */
  {
    const serp=(D.KEYWORD_RANK_SERP||[]).map(r=>({
      moc:(r.thoi_diem_track||'').trim(), id:(r.kw_id||'').trim(), kw:r.tu_khoa||'',
      vi:toInt(r.thu_hang), url:r.url_ghi_nhan||'', tang:(r.tang||'').trim(),
      tb:(r.thiet_bi||'').trim(), nguon:(r.nguon||'').trim()
    })).filter(r=>r.id && r.moc);
    const mocs=[...new Set(serp.map(r=>r.moc))].sort().reverse();
    M.serpMoc  = mocs[0]||null;
    M.serpTruoc= mocs[1]||null;
    M.serp     = serp.filter(r=>r.moc===M.serpMoc);
    M.serpMocs = mocs;
    M.coSerp   = M.serp.length>0;

    if(M.coSerp){
      /* phân bố hạng của mốc mới nhất */
      const co=M.serp.filter(r=>r.vi!=null);
      M.serpCoHang=co.length; M.serpTong=M.serp.length;
      M.serpBins=[['1–3',0,3],['4–10',3,10],['11–20',10,20],['21–50',20,50],['51–100',50,100]]
        .map(([nhan,a,b])=>({nhan, n:co.filter(r=>r.vi>a&&r.vi<=b).length}));
      M.serpThietBi=[...new Set(M.serp.map(r=>r.tb).filter(Boolean))].join(', ');

      /* biến động so mốc trước */
      if(M.serpTruoc){
        const pm=new Map();
        serp.filter(r=>r.moc===M.serpTruoc).forEach(r=>pm.set(r.id,r.vi));
        let len=0,xuong=0,giu=0,moiVao=0,roiRa=0;
        M.serp.forEach(r=>{
          const p=pm.get(r.id);
          if(p==null && r.vi!=null) moiVao++;
          else if(p!=null && r.vi==null) roiRa++;
          else if(p!=null && r.vi!=null){ if(r.vi<p) len++; else if(r.vi>p) xuong++; else giu++; }
        });
        M.serpBD={len,xuong,giu,moiVao,roiRa};
      }else M.serpBD=null;

      /* đối chiếu chéo với vị trí Search Console cùng bộ từ khoá */
      const gmap=new Map(M.kw.filter(k=>k.vi!=null).map(k=>[k.id,k]));
      const cap=[];
      M.serp.forEach(r=>{
        if(r.vi==null) return;
        const g=gmap.get(r.id); if(!g) return;
        cap.push({id:r.id, kw:r.kw, s:r.vi, g:g.vi, ch:r.vi-g.vi,
                  urlS:r.url, urlG:g.viUrl||'', urlM:g.url||''});
      });
      const cut=u=>String(u||'').replace(/^https?:\/\/[^/]+/,'').replace(/\/+$/,'')||'';
      M.doiChieu={
        n:cap.length,
        khop  :cap.filter(c=>Math.abs(c.ch)<=5).length,
        vua   :cap.filter(c=>Math.abs(c.ch)>5 && Math.abs(c.ch)<=15).length,
        lon   :cap.filter(c=>Math.abs(c.ch)>15).length,
        tbCh  :cap.length? cap.reduce((a,b)=>a+b.ch,0)/cap.length : null,
        spTot :cap.filter(c=>c.ch<0).length,
        spKem :cap.filter(c=>c.ch>0).length,
        urlLech:cap.filter(c=>c.urlM && c.urlS && cut(c.urlS)!==cut(c.urlM)).length,
        urlCo :cap.filter(c=>c.urlM && c.urlS).length,
        top:cap.slice().sort((a,b)=>Math.abs(b.ch)-Math.abs(a.ch)).slice(0,10)
      };
    }else{ M.doiChieu=null; M.serpBD=null; }
  }

  /* --- GA4 (tuỳ chọn) --- */
  M.ga4 = (D.GA4_DAILY||[]).map(r=>({
    ngay:dOnly(r.ngay), ses:toInt(r.sessions), users:toInt(r.users), org:toInt(r.sessions_organic)
  })).filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.ngay)).sort((a,b)=>a.ngay.localeCompare(b.ngay));
  M.coGA4 = M.ga4.length>0;
  M.ga4Ky = [];
  if(M.coGA4){
    M.ga4Last = M.ga4[M.ga4.length-1].ngay;
    for(let i=0;i<2;i++){
      const den=addDays(M.ga4Last,-M.N*i), tu=addDays(den,-(M.N-1));
      const seg=M.ga4.filter(d=>d.ngay>=tu&&d.ngay<=den);
      M.ga4Ky.push({
        tu, den, ngay:seg.length,
        ses:  seg.reduce((a,b)=>a+(b.ses||0),0),
        users:seg.reduce((a,b)=>a+(b.users||0),0),
        org:  seg.reduce((a,b)=>a+(b.org||0),0),
        /* Click Search Console tính trên ĐÚNG cửa sổ ngày của GA4.
           Hai nguồn chốt số lệch nhau 1 ngày, lấy nguyên kỳ GSC mà so là sai. */
        gscClicks: M.daily.filter(d=>d.ngay>=tu&&d.ngay<=den).reduce((a,b)=>a+b.clicks,0)
      });
    }

    /* Gộp tháng để đối chiếu mức giảm với Search Console. Bỏ tháng thiếu ngày. */
    const mm=new Map();
    M.ga4.forEach(d=>{
      const k=d.ngay.slice(0,7);
      if(!mm.has(k)) mm.set(k,{thang:k,ses:0,org:0,ngay:0});
      const m=mm.get(k); m.ses+=d.ses||0; m.org+=d.org||0; m.ngay++;
    });
    M.ga4Thang=[...mm.values()].sort((a,b)=>a.thang.localeCompare(b.thang)).map(m=>{
      const [y,mo]=m.thang.split('-').map(Number);
      const dim=new Date(Date.UTC(y,mo,0)).getUTCDate();
      return {...m, dim, partial:m.ngay<dim};
    });
    const du=M.ga4Thang.filter(m=>!m.partial);
    if(du.length>1){
      const dinh=du.reduce((a,b)=>(!a||b.org>a.org)?b:a,null);
      const nay=du[du.length-1];
      M.ga4Drop = dinh.org ? (nay.org-dinh.org)/dinh.org : null;
      M.ga4DinhThang=dinh.thang; M.ga4NayThang=nay.thang;
    }
  }

  /* --- LEAD: khách điền form. Tab có thể chưa có dữ liệu. --- */
  M.lead = (D.LEAD||[]).map(r=>({
    ngay:dOnly(r.ngay), form:r.ten_form||'(không rõ)',
    url:(r.url_trang||'').replace(/^https?:\/\/[^/]+/,''),
    nguon:r.nguon||'', ghi:r.ghi_chu||''
  })).filter(r=>/^\d{4}-\d{2}(-\d{2})?$/.test(r.ngay)).sort((a,b)=>a.ngay.localeCompare(b.ngay));
  /* Cột ngay nhận cả YYYY-MM-DD lẫn YYYY-MM. Dạng tháng dùng khi chỉ biết lead rơi vào
     tháng nào, chưa có ngày cụ thể — ghi đúng mức mình biết, không bịa ngày cho đủ định dạng. */
  M.leadCoNgay = M.lead.filter(l=>String(l.ngay).length===10);
  M.coLead = M.lead.length>0;
  if(M.coLead){
    M.leadDau=M.lead[0].ngay; M.leadCuoi=M.lead[M.lead.length-1].ngay;
    const den=M.lastDay||M.leadCuoi, tu=addDays(den,-(M.N-1));
    M.leadKy = M.lead.filter(l=>l.ngay>=tu&&l.ngay<=den).length;
    const den2=addDays(den,-M.N), tu2=addDays(den2,-(M.N-1));
    M.leadKyTruoc = M.lead.filter(l=>l.ngay>=tu2&&l.ngay<=den2).length;
    /* Tỷ lệ đổi click thành lead — chỉ tính trên khoảng ngày mà CẢ HAI nguồn cùng có dữ liệu */
    const clk = M.daily.filter(d=>d.ngay>=M.leadDau&&d.ngay<=M.leadCuoi).reduce((a,b)=>a+b.clicks,0);
    M.leadTrenClick = clk ? M.lead.length/clk : null;
    M.leadClickNen = clk;
  }

  /* --- Ahrefs --- */
  M.ahrefs = (D.AHREFS_KPI||[]).map(r=>({
    ngay:dOnly(r.ngay_lay), cauhinh:r.cau_hinh||'',
    dr:toInt(r.dr), ur:toInt(r.ur), bl:toInt(r.backlinks), blAll:toInt(r.backlinks_alltime),
    rd:toInt(r.ref_domains), rdAll:toInt(r.rd_alltime), okw:toInt(r.organic_keywords),
    /* kw_top3 và kw_1_3 là CÙNG một chỉ số, chỉ khác tên cột do lịch sử nhập tay.
       Mốc nào chỉ điền một trong hai thì vẫn phải đọc ra được, nếu không cả mốc đó
       biến mất khỏi biểu đồ tiến trình. */
    top3:toInt(r.kw_top3),
    k13: toInt(r.kw_1_3)!=null ? toInt(r.kw_1_3) : toInt(r.kw_top3),
    k13Goc: toInt(r.kw_1_3),
    k410:toInt(r.kw_4_10), k1120:toInt(r.kw_11_20), k2150:toInt(r.kw_21_50),
    k51100:toInt(r.kw_51_100),
    traffic:toInt(r.organic_traffic), value:toInt(r.traffic_value_usd), ghi:r.ghi_chu||''
  })).filter(r=>r.ngay).sort((a,b)=>a.ngay.localeCompare(b.ngay));
  M.ahLast = last(M.ahrefs.filter(r=>r.dr!=null)) || last(M.ahrefs);

  /* --- AI responses --- */
  const ai=(D.AI_RESPONSES||[]).map(r=>({
    ngay:dOnly(r.ngay_lay), nen:r.nen_tang, res:toInt(r.responses)||0, pages:toInt(r.pages)||0,
    tt:r.trang_thai_nen_tang||'', ghi:r.ghi_chu||''
  })).filter(r=>r.nen);
  const aiLast = ai.length? ai.map(r=>r.ngay).sort().pop() : null;
  M.ai = ai.filter(r=>r.ngay===aiLast).sort((a,b)=>b.res-a.res);
  M.aiDate = aiLast;
  M.aiTotal = M.ai.reduce((a,b)=>a+b.res,0);

  /* --- USP / issue / log --- */
  M.usp = (D.USP_CHECKLIST||[]).map(r=>({
    id:r.usp_id, nhom:r.nhom_usp||'', nd:r.noi_dung_usp||'', url:r.url_the_hien_tren_web||'',
    tren:r.co_tren_web||'', rui:r.rui_ro_phap_ly==='TRUE', canh:r.canh_bao_phap_ly||'',
    tt:r.trang_thai_noi_dung||'', ghi:r.ghi_chu||''
  })).filter(r=>r.id);
  M.issues = (D.SITE_ISSUES||[]).map(r=>({
    id:r.issue_id, ngay:dOnly(r.ngay_phat_hien), muc:r.muc_do||'', nhom:r.nhom_loi||'',
    mo:r.mo_ta||'', url:r.url_anh_huong||'', soUrl:toInt(r.so_url), mat:toInt(r.clicks_mat),
    tt:r.trang_thai||'', ai:r.nguoi_xu_ly||'', ghi:r.ghi_chu||''
  })).filter(r=>r.id);
  M.log = (D.UPDATE_LOG||[]).map(r=>{
    const gn=dOnly(r.cap_nhat_gan_nhat);
    const dn=(gn && dayNum(gn)!=null) ? (dayNum(today())-dayNum(gn)) : null;
    const nhip=toInt(r.nhip_ngay);
    let tt='CHƯA CÓ';
    if(dn!=null) tt = (nhip && dn>nhip*1.5) ? 'QUÁ HẠN' : (nhip && dn>nhip ? 'SẮP TRỄ' : 'OK');
    return {khoi:r.khoi, nhip:r.nhip, nhipNgay:nhip, nguon:r.nguon, phut:toInt(r.cong_suc_phut),
            gn, songay:dn, tt, ai:r.nguoi_cap_nhat||'', ghi:r.ghi_chu||''};
  }).filter(r=>r.khoi);
  M.aiRank = D.AI_RANK_LOG||[];
  M.uspLog = D.USP_CHECK_LOG||[];
}

function last(a){ return a&&a.length? a[a.length-1] : null; }

function groupPeriods(rows){
  const m=new Map();
  (rows||[]).forEach(r=>{
    const tu=dOnly(r.tu_ngay), den=dOnly(r.den_ngay);
    if(!tu||!den) return;
    const k=tu+'|'+den;
    if(!m.has(k)) m.set(k,{tu,den,rows:[]});
    m.get(k).rows.push(r);
  });
  return [...m.values()].map(p=>{
    const a=dayNum(p.tu), b=dayNum(p.den);
    return {...p, days:(a!=null&&b!=null)? b-a+1 : null, n:p.rows.length};
  }).sort((x,y)=> y.den.localeCompare(x.den) || (y.days||0)-(x.days||0));
}
function pickPeriod(ps){
  if(!ps||!ps.length) return null;
  /* Sửa 15/08/2026: bỏ ưu tiên kỳ ≤31 ngày.
     Script GSC đã chuyển sang kỳ 90 ngày (độ phủ 403 từ khoá thay vì 123).
     Luật cũ ưu tiên kỳ ngắn nên khi hai lô cùng nằm trong bảng, dashboard
     bám lô 7 ngày và bỏ qua lô dài — hiện thiếu 2/3 số từ khoá. */
  return ps[0];
}
function pLabel(p){
  if(!p) return '—';
  return `${dvn(p.tu)} → ${dvn(p.den)}` + (p.days==null? ` · toàn kỳ (${p.n} dòng mẫu)` : ` · ${p.days} ngày`);
}
function isSample(p){ return p && (p.days==null || p.days>31) && p.n<100; }

/* --- phân loại trang trong 1 kỳ --- */
function pageSplit(p){
  const out={thuong_mai:{n:0,c:0}, homepage:{n:0,c:0}, blog:{n:0,c:0}}, tot={n:0,c:0};
  (p?p.rows:[]).forEach(r=>{
    const t=(r.loai_trang||'blog').trim(); const c=toInt(r.clicks)||0;
    if(!out[t]) out[t]={n:0,c:0};
    out[t].n++; out[t].c+=c; tot.n++; tot.c+=c;
  });
  const tm=out.thuong_mai?out.thuong_mai.c:0;
  return {out, tot, pctTM: tot.c? tm/tot.c : null};
}
/* --- phân loại query trong 1 kỳ --- */
function querySplit(p){
  let brand={n:0,c:0}, intent={n:0,c:0}, khac={n:0,c:0}, tot={n:0,c:0};
  (p?p.rows:[]).forEach(r=>{
    const c=toInt(r.clicks)||0; tot.n++; tot.c+=c;
    if(r.la_brand==='TRUE'){ brand.n++; brand.c+=c; }
    else if(r.co_intent_hoc_nghe==='TRUE'){ intent.n++; intent.c+=c; }
    else { khac.n++; khac.c+=c; }
  });
  return {brand,intent,khac,tot};
}

<script>
/* ============================================================================
   5 · MẢNH GIAO DIỆN DÙNG LẠI
   ============================================================================ */
const SHEET_URL = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${gid}`;

function srcLink(tab){
  return `<a class="src-a" href="${SHEET_URL(GID[tab]||'')}" target="_blank" rel="noopener">${tab} ↗</a>`;
}
function bd(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase(); }
/* khớp lỏng theo từ khoá, không khớp nguyên văn — đổi chữ trong Sheet vẫn chạy */
function freshness(key){
  const k=bd(key);
  const r=M.log.find(x=>bd(x.khoi).startsWith(k)) || M.log.find(x=>bd(x.khoi).includes(k));
  if(!r) return '';
  if(r.songay==null) return `<span class="bd bd-md">chưa cập nhật lần nào</span>`;
  const cls = r.tt==='OK'?'bd-ok' : r.tt==='SẮP TRỄ'?'bd-md':'bd-hi';
  const d = r.songay<=0 ? 'hôm nay' : `${r.songay} ngày trước`;
  return `<span class="bd ${cls}" title="Nhịp ${r.nhip} · nguồn ${r.nguon}">cập nhật ${d}</span>`;
}
function kpi(o){
  return `<div class="kpi ${o.cls||''}">
    <div class="lab">${esc(o.lab)}${o.tag?` <span class="bd bd-bn">${esc(o.tag)}</span>`:''}</div>
    <div class="val num">${o.val}${o.unit?`<small> ${esc(o.unit)}</small>`:''}</div>
    <div class="sub">${o.sub||''}</div>
  </div>`;
}
function note(type, icon, html){ return `<div class="note n-${type}"><span class="ic">${icon}</span><div>${html}</div></div>`; }
function empty(title, msg){ return `<div class="empty"><b>${esc(title)}</b>${msg||''}</div>`; }

const ANON_NOTE = noteOff('warn','⚠︎',
  `<b>Đọc số từ khoá phải trừ hao.</b> Google ẩn danh phần lớn truy vấn: kỳ gần nhất trang web nhận
   <b id="anon-page">—</b> click nhưng bảng từ khoá chỉ giải thích được <b id="anon-query">—</b> click
   (<b id="anon-pct">—</b> lượt click không biết đến từ từ khoá nào). Mọi phân tích cấp từ khoá bên dưới
   chỉ nhìn được phần nhỏ bức tranh, không dùng để kết luận tổng thể.`);

function anonFill(){
  const ps=pageSplit(M.selPage), qs=querySplit(M.selQuery);
  const hid = ps.tot.c ? (ps.tot.c-qs.tot.c)/ps.tot.c : null;
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('anon-page', fi(ps.tot.c)); set('anon-query', fi(qs.tot.c)); set('anon-pct', hid==null?'—':fp(hid,0));
}

/* ---------------------------------------------------------------------------
   Ghi chú diễn giải đã TẮT ngày 17/08/2026 theo yêu cầu của Linh.
   Dashboard là báo cáo cho sếp: chỉ đưa số, không giảng giải cách đọc số.
   Không xoá hẳn — chỉ đổi note(...) thành noteOff(...) ở 14 chỗ.
   Muốn bật lại cái nào thì đổi tên hàm ngược lại tại đúng chỗ đó.
   --------------------------------------------------------------------------- */
function noteOff(){ return ''; }

/* bảng có thể sắp xếp */
function sortTable(el, col, type){
  const tb=el.closest('table').tBodies[0];
  const idx=[...el.parentNode.children].indexOf(el);
  const cur=el.classList.contains('asc')?'asc':el.classList.contains('desc')?'desc':'';
  [...el.parentNode.children].forEach(th=>th.classList.remove('asc','desc'));
  const dir = cur==='desc' ? 'asc' : 'desc';
  el.classList.add(dir);
  const rows=[...tb.rows];
  rows.sort((a,b)=>{
    let x=a.cells[idx].dataset.v ?? a.cells[idx].textContent;
    let y=b.cells[idx].dataset.v ?? b.cells[idx].textContent;
    if(type!=='s'){ x=parseFloat(x); y=parseFloat(y);
      if(isNaN(x)) x= dir==='desc'?-Infinity:Infinity;
      if(isNaN(y)) y= dir==='desc'?-Infinity:Infinity;
      return dir==='desc'? y-x : x-y;
    }
    return dir==='desc'? String(y).localeCompare(String(x),'vi') : String(x).localeCompare(String(y),'vi');
  });
  rows.forEach(r=>tb.appendChild(r));
}
function th(label, type, cls){
  return `<th class="s ${cls||''}" onclick="sortTable(this,0,'${type||'n'}')">${label}</th>`;
}
</script>
<script>
/* ============================================================================
   6 · TAB 0 — TỔNG QUAN  (dựng lại 17/08/2026 theo mô hình dashboard BI)
   Nguyên tắc phạm vi thời gian, áp dụng thống nhất cho cả tab:
     · Bảng chỉ số   = tháng đang chạy tính đến ngày mới nhất (MTD),
                       so với ĐÚNG số ngày đó của tháng trước.
     · Bảng phân bổ  = tháng đủ gần nhất, vì nguồn chỉ có mức tháng,
                       cắt MTD sẽ phải bịa số.
     · Biểu đồ       = toàn bộ chuỗi tháng, tháng khuyết vẽ mờ.
     · Bảng trang    = kỳ tuần có đủ số.
     · Thứ hạng      = mốc quét SERP gần nhất.
   ============================================================================ */

/* Kỳ trang phải là kỳ có đủ số. Tab GSC_PAGE trộn nhiều kỳ: kỳ "toàn thời gian"
   chỉ nhập tay 14 dòng và khuyết cột vị trí lẫn lượt hiện ra. Lấy nhầm kỳ đó thì
   bảng trang chỉ còn trang chủ có số — đúng lỗi anh Hiếu nêu ngày 17/08. */
function kyTrangDung(){
  const ps = M.pagePeriods||[];
  if(!ps.length) return null;
  const du = ps.filter(p=>p.days!=null && p.days<=31 && p.n>=30);
  if(du.length) return du.slice().sort((a,b)=>b.den.localeCompare(a.den))[0];
  return ps[0];
}

/* Cắt tháng-đến-ngày và cùng số ngày đó của tháng trước. Không quy đổi, không
   ngoại suy: chỉ cộng đúng những ngày cả hai tháng đều có. */
function catMTD(arr, ngayCuoi){
  if(!arr || !arr.length || !ngayCuoi) return null;
  const y=+ngayCuoi.slice(0,4), m=+ngayCuoi.slice(5,7), d=+ngayCuoi.slice(8,10);
  const th=ngayCuoi.slice(0,7);
  const pm = m===1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`;
  const lay=(k)=>arr.filter(r=>String(r.ngay).slice(0,7)===k && +String(r.ngay).slice(8,10)<=d);
  return {th, pm, d, nay:lay(th), truoc:lay(pm)};
}

/* Khoảng ngày thật của một tháng trong GSC_QUERY_MONTHLY. Tháng đang chạy chỉ có
   một phần ngày — phải nói ra, nếu không người đọc tưởng là tháng đủ. */
function khoangQM(thang){
  const r=(D.GSC_QUERY_MONTHLY||[]).find(x=>x.thang===thang);
  if(!r) return null;
  const tu=dOnly(r.tu_ngay), den=dOnly(r.den_ngay);
  if(!tu||!den) return null;
  const [y,m]=thang.split('-').map(Number);
  const dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  const so=(dayNum(den)-dayNum(tu))+1;
  return {tu,den,so,dim,du:so>=dim};
}

function khungTG(){
  if(M._khung) return M._khung;
  const du=(M.months||[]).filter(m=>!m.partial);
  M._khung={
    gscCuoi : M.lastDay||null,
    ga4Cuoi : M.coGA4 ? M.ga4Last : null,
    thangDu : du.length? du[du.length-1].thang : null,
    kyTrang : kyTrangDung(),
    serpMoc : M.serpMoc||null
  };
  return M._khung;
}

/* Tra tiêu đề bài từ PAGE_META theo đường dẫn đã chuẩn hoá. */
function titleCua(u){
  if(!M._meta){
    M._meta=new Map();
    (D.PAGE_META||[]).forEach(r=>{
      const k=String(r.url||r.slug||'').replace(/^https?:\/\/[^/]+/,'').replace(/[?#].*$/,'');
      const k2='/'+k.replace(/^\/+|\/+$/g,'')+'/';
      if(r.tieu_de) M._meta.set(k2, r.tieu_de);
    });
  }
  const k='/'+String(u||'').replace(/[?#].*$/,'').replace(/^\/+|\/+$/g,'')+'/';
  return M._meta.get(k) || (k==='//' ? 'Trang chủ' : '—');
}

         Nói cách khác, đây không phải lỗi đo lường hay lỗi gắn thẻ.`)}</div>` : ''}

        đồng thời mất số khi người dùng chặn cookie hoặc thoát trước lúc thẻ kịp chạy.
        Cột giữa đã lọc riêng kênh tìm kiếm tự nhiên nhưng vẫn gộp cả Bing và Cốc Cốc, không riêng Google —
        và một người bấm vào một lần rồi quay lại sau nửa tiếng sẽ tính thành hai phiên nhưng chỉ một click.
        ${lech!=null?`Cùng khoảng ${dvn(k0.tu)}–${dvn(k0.den)}: Search Console ghi ${fi(k0.gscClicks)} click, Analytics ghi ${fi(k0.org)} phiên tự nhiên, chênh ${nf1.format(Math.abs(lech*100))}% — mức chênh này bình thường.`:''}
        ${!du?`<br><b>Chưa so kỳ được:</b> kỳ trước mới có ${k1?k1.ngay:0}/${M.N} ngày dữ liệu.`:''}
      </div>
    </div></div>`;
}
/* Khối lead. Chưa nối dữ liệu thì hiện đúng trạng thái đó, không giấu đi —
   để người đọc biết còn thiếu chứ không tưởng là bằng 0. */
function khoiLead(){
  const h0 = `<div class="sec"><div class="sec-h">
      <span class="eyebrow">Ra tiền</span><h3>Khách để lại thông tin</h3>
      <span class="src">${srcLink('LEAD')}</span></div>`;

  if(!M.coLead){
    return h0 + `<div class="card">${empty('Chưa nối dữ liệu form đăng ký',
      `Website <b>có</b> lưu thông tin khách điền form, nhưng chưa đổ vào bảng này nên báo cáo chưa tính được.
       <br><br>Cách nối: tạo tab <b>LEAD</b> trong Google Sheet với 5 cột
       <span class="mono">ngay · ten_form · url_trang · nguon · ghi_chu</span>, mỗi dòng là một lượt khách điền form.
       Dán dữ liệu vào là khối này tự hiện, không cần sửa gì thêm.
       <br><br>Đây là chỉ số duy nhất nối được kết quả SEO với doanh thu. Mọi con số khác trong báo cáo
       đều dừng ở mức lưu lượng truy cập.`)}</div></div>`;
  }

  const d = delta(M.leadKy, M.leadKyTruoc, 'up');
  const theoForm = {};
  M.lead.forEach(l=>{ theoForm[l.form]=(theoForm[l.form]||0)+1; });
  const dsForm = Object.keys(theoForm).sort((a,b)=>theoForm[b]-theoForm[a]);

  const theoTrang = {};
  let coUrl = 0;
  M.lead.forEach(l=>{ if(l.url){ theoTrang[l.url]=(theoTrang[l.url]||0)+1; coUrl++; } });
  const dsTrang = Object.keys(theoTrang).sort((a,b)=>theoTrang[b]-theoTrang[a]).slice(0,10);

  let h = h0 + `<div class="grid g4" style="margin-bottom:14px">
    ${kpi({lab:'Tổng khách để lại thông tin', val:fi(M.lead.length), cls:'k-up',
           sub:`${dvn(M.leadDau)} → ${dvn(M.leadCuoi)}`})}
    ${kpi({lab:`${M.N} ngày gần nhất`, val:fi(M.leadKy), sub:`${d.html} so kỳ trước (${fi(M.leadKyTruoc)})`})}
    ${kpi({lab:'Cứ bao nhiêu click ra 1 khách', val: M.leadTrenClick? fi(Math.round(1/M.leadTrenClick)) : '—',
           unit:'click', sub: M.leadTrenClick? `tỷ lệ ${fp(M.leadTrenClick,2)} trên ${fi(M.leadClickNen)} click` : ''})}
    ${kpi({lab:'Số form đang chạy', val:fi(dsForm.length), sub: dsForm.slice(0,2).map(esc).join(' · ')})}
  </div>`;

  h += `<div class="grid g2">
    <div class="card card-p"><h4 style="font-size:13px;margin-bottom:10px">Theo từng form</h4>
      ${hbarChart({items:dsForm.slice(0,6).map(f=>({k:f.length>22?f.slice(0,21)+'…':f, v:theoForm[f]})),
                   lw:150, w:600, mr:60, color:CO.up})}
    </div>
    <div class="card card-p"><h4 style="font-size:13px;margin-bottom:10px">Khách điền form ở trang nào</h4>`;

  if(!coUrl){
    h += empty('Chưa có thông tin trang nguồn',
      `Dữ liệu form không lưu địa chỉ trang mà khách đã điền, nên chưa trả lời được câu
       “data đến từ những page nào”. Cần thêm một trường ẩn vào form để ghi lại, áp dụng từ nay về sau.`);
  }else{
    h += `<div class="tw" style="box-shadow:none;border:0"><table><thead><tr><th>Trang</th><th class="r">Số khách</th></tr></thead><tbody>`
       + dsTrang.map(u=>`<tr><td class="mono tt">${esc(u)}</td><td class="r"><b>${fi(theoTrang[u])}</b></td></tr>`).join('')
       + `</tbody></table></div>`
       + (coUrl<M.lead.length ? `<div class="cap">${fi(M.lead.length-coUrl)}/${fi(M.lead.length)} lượt không ghi trang nguồn.</div>` : '');
  }
  return h + `</div></div></div>`;
}
function statusBadge(t){
  const map={cho_quyet:['bd-md','chờ quyết'], moi:['bd-hi','mới'], dang_xu_ly:['bd-bn','đang xử lý'],
             da_xong:['bd-ok','đã xong'], khong_xu_ly:['bd-lo','không xử lý']};

     Đây là dấu hiệu <b>zero-click</b>: Google và các công cụ AI trả lời thẳng trên trang kết quả,
     người dùng đọc xong không bấm vào web nữa. Xếp hạng tốt hơn không còn tự động đổi thành lượt truy cập.`)}</div>`;

  /* --- biểu đồ tuần --- */
  const wk=M.weeks.slice(-26);

    <div class="card card-p">

      })}
      <div class="legend">
        <span><i style="background:${CO.blue}"></i>Click (tuần đủ 7 ngày)</span>
        <span><i style="background:#BBD6EC"></i>Tuần chưa đủ 7 ngày</span>
        <span><i style="background:${CO.warn}"></i>Lượt hiển thị — trục phải</span>
      </div>
    </div></div>`;

  /* --- bảng tháng --- */
  h+=`<div class="sec"><div class="sec-h"><h3>Theo tháng</h3><span class="src">${srcLink('GSC_MONTHLY')}</span></div>
    <div class="tw"><table><thead><tr>
      ${th('Tháng','s')}${th('Click','n','r')}${th('Hiển thị','n','r')}${th('CTR','n','r')}${th('Vị trí TB','n','r')}

  [...M.months].slice(-SO_THANG).reverse().forEach(m=>{
    h+=`<tr${m.partial?' style="background:#FDFBF4"':''}>

  });
  h+=`</tbody></table></div>
    ${M.months.some(m=>m.partial)?`<div style="margin-top:10px">${noteOff('warn','⚠︎',
      `<b>Tháng khuyết ngày không đem so ngang.</b> ${M.months.filter(m=>m.partial).map(m=>`${esc(m.thang)} chỉ có ${m.days}/${m.dim} ngày`).join(' · ')}.
       So một tháng thiếu ngày với tháng đủ ngày sẽ ra kết luận sai về xu hướng.`)}</div>`:''}
  </div>`;

  /* --- thiết bị & quốc gia --- */
  const seg=M.selSeg;
  const dev=(seg?seg.rows:[]).filter(r=>r.loai_phan_khuc==='thiet_bi')
      .map(r=>({k:r.gia_tri, v:toInt(r.clicks)||0, pos:toFloat(r.position), ctr:toRate(r.ctr)}))
      .sort((a,b)=>b.v-a.v);
  const ctry=(seg?seg.rows:[]).filter(r=>r.loai_phan_khuc==='quoc_gia')
      .map(r=>({k:r.gia_tri, v:toInt(r.clicks)||0}))
      .sort((a,b)=>b.v-a.v).slice(0,8);
  const devTot=dev.reduce((a,b)=>a+b.v,0);
  h+=`<div class="sec"><div class="sec-h"><h3>Thiết bị và quốc gia</h3>
      <span class="src">${pLabel(seg)} · ${srcLink('GSC_SEGMENT')}</span></div>

        ${devTot?`<div class="cap">Tổng ${fi(devTot)} click. Vị trí trên máy tính thường kém hơn nhiều so với điện thoại — đáng xem lại trải nghiệm bản desktop.</div>`:''}

  if(ch.length){

    const duNgay = new Set((M.months||[]).filter(m=>!m.partial).map(m=>m.thang));

    });
    h+=`</tbody></table></div>`;
    const org=rowsKe.find(r=>/organic search/i.test(r.ng));

        <br><span style="opacity:.85">Hai mốc so sánh đều là tháng <b>đủ ngày</b>${dayDu?'':' — CẢNH BÁO: không tìm được đủ hai tháng đủ ngày, số dưới đây có thể lệch'}.

    }
    h+=`</div>`;
  }else{
    h+=`<div class="sec">${empty('Chưa có dữ liệu nguồn traffic',

}

<script>

  {

    h+=`<div class="mb">${noteOff('warn','⚠︎',

  /* --- Cảnh báo 2: site này là site mobile, thứ hạng hai thiết bị lệch rất xa --- */

  /* --- Cảnh báo 3: cột mốc cũ trong KEYWORD_MASTER trộn nhiều thời điểm --- */
  {

  /* --- CÂU 6: hai thước đo Top 10 — đổi nguồn đối chiếu 17/08/2026.

  /* --- Query ≠ Keyword: hai bộ số đo hai thứ khác nhau (thêm 15/08/2026) --- */
  {
    const chuanKw = x => String(x||'').toLowerCase().replace(/\s+/g,' ').trim();

    let qTrong=0,qNgoai=0,cTrong=0,cNgoai=0;

      if(boTarget.has(k)){ qTrong++; cTrong+=v.c; } else { qNgoai++; cNgoai+=v.c; }
    });
    const qTong=qTrong+qNgoai, cTong=cTrong+cNgoai;
    const kwHien = [...boTarget].filter(k=>gop.has(k)).length;
    const kwChua = boTarget.size - kwHien;

            <td class="r"><b>${fi(qTong)}</b></td><td class="r"><b>${fi(cTong)}</b></td>
            <td style="font-size:12px;color:var(--muted)">Search Console</td></tr>

          ${kpi({lab:'Click đến từ nhóm ngoài đó', val:cTong?fp(cNgoai/cTong,1):'—', sub:`${fi(cNgoai)} lượt bấm`})}
          ${kpi({lab:'Từ khoá chưa từng hiện ra', val:fi(kwChua), cls:'k-warn', sub:`trên ${fi(boTarget.size)} từ khoá đang theo dõi`})}

          Có <b>${fi(kwChua)}</b> từ khoá đang theo dõi mà website <b>chưa từng một lần hiện ra</b> trên kết quả tìm —
          Search Console chỉ báo cáo khi có lượt hiển thị, nên không có số ở đây nghĩa là chưa xuất hiện,
          không phải lỗi đo và không phải hạng 0.<br>
          Ngược lại, <b>${fp(cTong?cNgoai/cTong:0,0)}</b> lượt bấm đến từ những câu tìm dự án không hề nhắm tới.`)}
      </div>`;

  /* --- Cách đọc số của kỳ dài + độ phủ (thêm 15/08/2026, mục D5) --- */
  {

        <div class="g4" style="margin-bottom:12px">

          ${kpi({lab:'Lệch vừa', val:fi(dc.vua), sub:`lệch 6–15 bậc · ${fp(dc.vua/dc.n,1)}`})}
          ${kpi({lab:'Lệch lớn', val:fi(dc.lon), cls:'k-warn', sub:`lệch trên 15 bậc · ${fp(dc.lon/dc.n,1)}`})}
          ${kpi({lab:'Lên sai trang', val:fi(dc.urlLech), cls:'k-warn', sub:`trên ${fi(dc.urlCo)} từ khoá có ghi trang mục tiêu`})}
        </div>
        ${noteOff('info','◆',`<b>Hai nguồn lệch nhau là chuyện bình thường, không phải nguồn nào sai.</b>

          <br><br><b>Cách dùng:</b> lấy quét SERP để trả lời “hôm nay đứng thứ mấy”,

          ${fi(dc.lon)} từ khoá lệch trên 15 bậc là danh sách cần rà tay — xuất riêng ra tệp, không đưa lên đây.`)}
      </div>`;
    }
  }

  /* --- tổng hợp theo chủ đề --- */
  const byTopic=new Map();
  M.kw.forEach(k=>{
    if(!byTopic.has(k.chu_de)) byTopic.set(k.chu_de,{chu_de:k.chu_de,n:0,click:0,impr:0,nRank:0,top3:0,top10:0,posSum:0,nIntent:0,nhom:{}});
    const t=byTopic.get(k.chu_de);
    t.n++; t.click+=(k.viClicks||0); t.impr+=(k.viImpr||0); if(k.intent) t.nIntent++;
    t.nhom[k.nhom]=(t.nhom[k.nhom]||0)+1;
    if(k.vi!=null){ t.nRank++; t.posSum+=k.vi; if(k.vi<=3) t.top3++; if(k.vi<=10) t.top10++; }
  });
  const topics=[...byTopic.values()].map(t=>({...t, pos: t.nRank? t.posSum/t.nRank : null,
      nhomChinh: Object.entries(t.nhom).sort((a,b)=>b[1]-a[1])[0][0]}))
      .sort((a,b)=> b.click-a.click || b.impr-a.impr);

  h+=`<div class="sec"><div class="sec-h"><h3>Bộ từ khoá theo chủ đề</h3>
      <span class="src">thứ hạng kỳ ${pLabel(M.selRank)} · ${srcLink('KEYWORD_RANK_WEEKLY')}</span></div>
    <div class="tw"><table><thead><tr>
      ${th('Chủ đề','s')}<th>Nhóm</th>${th('Số từ khoá','n','r')}${th('Lượt bấm','n','r')}
      ${th('Lượt hiện ra','n','r')}${th('Tỷ lệ bấm','n','r')}${th('Có thứ hạng','n','r')}${th('Top 10','n','r')}${th('Vị trí TB','n','r')}
    </tr></thead><tbody>`;
  topics.forEach(t=>{
    const ctr = t.impr? t.click/t.impr : null;
    h+=`<tr>
      <td data-v="${esc(t.chu_de)}"><b>${esc(t.chu_de)}</b></td>
      <td>${nhomBadge(t.nhomChinh)}</td>
      <td class="r" data-v="${t.n}">${fi(t.n)}</td>
      <td class="r" data-v="${t.click}"><b>${fi(t.click)}</b></td>
      <td class="r" data-v="${t.impr}">${fi(t.impr)}</td>
      <td class="r" data-v="${ctr==null?-1:ctr}">${ctr==null?'—':fp(ctr,2)}</td>
      <td class="r" data-v="${t.nRank}">${fi(t.nRank)}<span style="color:var(--faint)">/${fi(t.n)}</span></td>
      <td class="r" data-v="${t.top10}">${fi(t.top10)}</td>
      <td class="r" data-v="${t.pos==null?999:t.pos}">${f1(t.pos)}</td></tr>`;
  });
  h+=`</tbody></table></div>
  <div class="cap">Lượt bấm và lượt hiện ra là <b>số thật Search Console ghi nhận</b>, không phải lượt tìm kiếm ước lượng.
   Chủ đề xếp trên là chủ đề mang về nhiều lượt bấm nhất.
   Cột “có thứ hạng” đếm số từ khoá thực sự lọt bảng xếp hạng trong kỳ — ô trống nghĩa là chưa lọt, không phải hạng 0.</div></div>`;

  /* --- cảnh báo tụt hạng / mốc cũ --- */
  const nguong = toInt(cfg('nguong_canh_bao_tut_hang')) || 3;
  if(M.hasPrevRank){
    const drops=M.kw.filter(k=>k.vi!=null && k.viPrev!=null && (k.vi-k.viPrev)>=nguong)
      .sort((a,b)=>(b.vi-b.viPrev)-(a.vi-a.viPrev)).slice(0,25);
    h+=`<div class="sec"><div class="sec-h"><h3>Cảnh báo tụt hạng</h3>
        <span class="src">tụt từ ${nguong} bậc trở lên so với kỳ trước</span></div>`;
    h+= drops.length? rankTable(drops,true) : `<div class="card">${empty('Không có từ khoá nào tụt quá ngưỡng','Ngưỡng hiện tại: '+nguong+' bậc (đổi ở tab CONFIG).')}</div>`;
    h+=`</div>`;
  }else{
    h+=`<div class="sec"><div class="sec-h"><h3>Cảnh báo tụt hạng</h3></div>
      <div class="card">${empty('Chưa đủ hai kỳ để so hạng',
      `Bảng <b>KEYWORD_RANK_WEEKLY</b> mới có 1 kỳ (${pLabel(M.selRank)}). Sau lần chạy script tuần tới sẽ tự có cột so kỳ.
       Cột “mốc cũ” trong bảng dưới lấy từ bảng keyword gốc nhưng <b>không ghi năm</b> (lỗi IS-019) nên chỉ để tham khảo.`)}</div></div>`;
  }

  /* --- 20 từ khoá dẫn đầu (rút gọn 17/08/2026: dashboard là báo cáo, không phải bảng rà tay) --- */
  {
    const ranked=M.kw.filter(k=>k.vi!=null).sort((a,b)=>a.vi-b.vi);
    const SHOW=20;
    const dan=ranked.slice(0,SHOW);
    h+=`<div class="sec"><div class="sec-h"><h3>${SHOW} từ khoá xếp hạng cao nhất</h3>
        <span class="src">${fi(ranked.length)}/${fi(M.kw.filter(k=>k.theoDoi).length)} từ khoá đang theo dõi lọt bảng xếp hạng</span></div>
      ${rankTable(dan,false)}
      <div class="cap">Đây là phần đầu bảng, dùng để nhìn nhanh nhóm đang mạnh nhất.
        ${fi(Math.max(ranked.length-SHOW,0))} từ khoá còn lại và toàn bộ danh sách rà tay nằm ở tab
        <span class="mono">KEYWORD_MASTER</span> và <span class="mono">KEYWORD_RANK_SERP</span> trong bảng tính —
        dashboard chỉ giữ số tổng hợp.</div>
    </div>`;
  }

  /* --- top query --- */
  const qs=(M.selQuery?M.selQuery.rows:[]).map(r=>({
    q:r.query, c:toInt(r.clicks)||0, i:toInt(r.impressions), ctr:toRate(r.ctr), pos:toFloat(r.position),
    brand:r.la_brand==='TRUE', intent:r.co_intent_hoc_nghe==='TRUE'
  })).sort((a,b)=>b.c-a.c).slice(0,20);
  h+=`<div class="sec"><div class="sec-h"><h3>20 truy vấn mang nhiều click nhất</h3>
      <span class="src">${pLabel(M.selQuery)} · ${srcLink('GSC_QUERY')}</span></div>`;
  if(isSample(M.selQuery)) h+=`<div class="mb">${noteOff('mut','ℹ︎',`Kỳ đang chọn chỉ là <b>mẫu ${M.selQuery.n} dòng</b> chép tay từ bản export gốc, không phải bảng đầy đủ.`)}</div>`;
  h+=`<div class="tw"><table><thead><tr><th>#</th><th>Truy vấn</th><th>Phân loại</th>
      <th class="r">Click</th><th class="r">Hiển thị</th><th class="r">CTR</th><th class="r">Vị trí</th></tr></thead><tbody>`;
  qs.forEach((q,i)=>{
    h+=`<tr><td class="r" style="color:var(--faint)">${i+1}</td>
      <td class="tt">${esc(q.q)}</td>
      <td>${q.brand?'<span class="bd bd-bn">thương hiệu</span>':q.intent?'<span class="bd bd-tm">học nghề</span>':'<span class="bd bd-lo">ngoài mục tiêu</span>'}</td>
      <td class="r"><b>${fi(q.c)}</b></td><td class="r">${fi(q.i)}</td>
      <td class="r">${fp(q.ctr)}</td><td class="r">${f1(q.pos)}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;

  /* --- Bảng phân bố thứ hạng Ahrefs đã GỠ khỏi tab này (17/08/2026, anh Hiếu chốt).
     Lý do: từ 15/08 đã có số quét SERP thật trong KEYWORD_RANK_SERP — đo trực tiếp,
     đúng bộ từ khoá dự án. Ahrefs là ước lượng bên thứ ba quét toàn site, đặt cạnh
     số đo thật thì hai bảng vênh nhau gây hiểu nhầm.
     Ahrefs VẪN GIỮ ở tab Tổng quan cho phần sức mạnh tên miền (DR, backlink) —
     chỗ đó Ahrefs là nguồn hợp lý. Hàm cotBacAhrefs và hằng BAC_RANK giữ nguyên
     phòng khi cần dựng lại. --- */

  return h;
}
/* Search Console không luôn trả URL xếp hạng -> lùi về URL mục tiêu và ghi rõ đó là dự kiến */
function urlCell(k){
  const cut = u => esc(String(u).replace(/^https?:\/\/[^/]+/,''));
  if(k.viUrl) return cut(k.viUrl);
  if(k.url)   return `${cut(k.url)} <span class="bd bd-lo" title="Search Console chưa trả URL xếp hạng cho từ khoá này. Đây là URL mục tiêu ghi trong bảng keyword, chưa phải URL đang thật sự lên hạng.">dự kiến</span>`;
  return '—';
}
function nhomBadge(n){
  const m={chinh:['bd-tm','chính'], phu:['bd-bn','phụ'], brand:['bd-hp','thương hiệu'], khong_muc_tieu:['bd-hi','ngoài mục tiêu']};
  const x=m[n]||['bd-lo',n||'—'];
  return `<span class="bd ${x[0]}">${esc(x[1])}</span>`;
}
function rankTable(rows, isDrop){
  let h=`<div class="tw"><table id="${isDrop?'tb-drop':'tb-kw'}"><thead><tr>
    ${th('Từ khoá','s')}<th>Chủ đề</th>${th('Vị trí','n','r')}
    ${M.hasPrevRank?th('Kỳ trước','n','r')+'<th class="r">Biến động</th>':'<th class="r">Mốc cũ</th>'}
    ${th('Lượt hiện ra','n','r')}${th('Lượt bấm','n','r')}<th>URL</th></tr></thead><tbody>`;
  rows.forEach(k=>{
    let cmp='';
    if(M.hasPrevRank){
      const dd = (k.vi!=null&&k.viPrev!=null)? k.viPrev-k.vi : null;
      cmp=`<td class="r" data-v="${k.viPrev==null?999:k.viPrev}">${f1(k.viPrev)}</td>
           <td class="r">${dd==null?'—':`<span class="chip ${dd>0?'chip-up':dd<0?'chip-down':'chip-flat'}">${dd>0?'+':''}${nf1.format(dd)}</span>`}</td>`;
    }else{
      cmp=`<td class="r" data-v="${k.hangCu==null?999:k.hangCu}">${k.hangCu==null?'—':`${f1(k.hangCu)} <span style="color:var(--faint);font-size:11px">(${esc(k.mocCu||'?')})</span>`}</td>`;
    }
    h+=`<tr data-topic="${esc(k.chu_de)}" data-intent="${k.intent?1:0}" data-pos="${k.vi==null?999:k.vi}" data-kw="${esc((k.kw||'').toLowerCase())}">
      <td data-v="${esc(k.kw)}"><b>${esc(k.kw)}</b>${k.ttUrl==='404'?' <span class="bd bd-hi">URL 404</span>':''}</td>
      <td style="font-size:12px">${esc(k.chu_de)} ${nhomBadge(k.nhom)}</td>
      <td class="r" data-v="${k.vi==null?999:k.vi}"><b>${f1(k.vi)}</b></td>
      ${cmp}
      <td class="r" data-v="${k.viImpr||0}">${fi(k.viImpr)}</td>
      <td class="r" data-v="${k.viClicks||0}"><b>${fi(k.viClicks)}</b></td>
      <td class="mono tt">${urlCell(k)}</td></tr>`;
  });
  return h+`</tbody></table></div>`;
}
let kwFilterGrp='';
function kwGrp(btn,g){
  [...btn.parentNode.children].forEach(b=>b.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed','true'); kwFilterGrp=g; filterKw();
}
function filterKw(){
  const tb=document.getElementById('tb-kw'); if(!tb) return;
  const t=(document.getElementById('kw-topic')||{}).value||'';
  const q=((document.getElementById('kw-q')||{}).value||'').toLowerCase().trim();
  let n=0;
  [...tb.tBodies[0].rows].forEach(r=>{
    let ok = (!t || r.dataset.topic===t) && (!q || r.dataset.kw.includes(q));
    if(ok && kwFilterGrp==='top10') ok = parseFloat(r.dataset.pos)<=10;
    if(ok && kwFilterGrp==='intent') ok = r.dataset.intent==='1';
    r.style.display = ok?'':'none'; if(ok) n++;
  });
  const c=document.getElementById('kw-count'); if(c) c.textContent=`hiện ${n} dòng`;
}
</script>
<script>
/* ============================================================================
   9 · TAB 3 — CHẤT LƯỢNG TRAFFIC
   ============================================================================ */
function tab3(){
  const ps=pageSplit(M.selPage), qs=querySplit(M.selQuery);
  let h='';

  h+=`<div class="sec"><div class="sec-h"><span class="eyebrow">Câu hỏi của anh Hiếu</span>
      <h2>Traffic này có ra tiền không?</h2>
      <span class="src">${pLabel(M.selPage)} · ${srcLink('GSC_PAGE')}</span></div>`;
  if(isSample(M.selPage)) h+=`<div class="mb">${noteOff('warn','⚠︎',
    `Kỳ đang chọn chỉ là <b>mẫu ${M.selPage.n} dòng top</b> chép từ bản export gốc — <b>không đủ để tính tỷ lệ %</b>.
     Hãy chọn một kỳ tuần đầy đủ ở ô bên dưới.`)}</div>`;

  h+=`<div class="ctl"><label style="font-size:12.5px;color:var(--muted);font-weight:600">Kỳ dữ liệu</label>
     <select id="pg-period" onchange="changePagePeriod(this.value)">
       ${M.pagePeriods.map((p,i)=>`<option value="${i}" ${p===M.selPage?'selected':''}>${esc(pLabel(p))}</option>`).join('')}
     </select></div>`;

  /* --- chỉ số 2 --- */
  h+=`<div class="grid g4" style="margin-bottom:16px">
    ${kpi({lab:'Bấm vào trang khoá học', val: ps.pctTM==null?'—':fp(ps.pctTM,1),
           sub:`${fi(ps.out.thuong_mai?ps.out.thuong_mai.c:0)} lượt · trang khoá học, học phí, tuyển sinh`})}
    ${kpi({lab:'Bấm vào bài blog', val: ps.tot.c? fp(ps.out.blog.c/ps.tot.c,1):'—', sub:`${fi(ps.out.blog.c)} lượt · trải trên ${fi(ps.out.blog.n)} bài`})}

    ${kpi({lab:'Người tìm việc ngoài ngành', val: qs.tot.c? fp(qs.khac.c/qs.tot.c,1):'—',
           cls:'k-warn', sub:`${fi(qs.khac.c)} lượt · không tìm chỗ học nghề`})}
  </div>`;

  /* --- thanh xếp chồng --- */
  h+=`<div class="card card-p" style="margin-bottom:16px">
    <h4 style="font-size:13px;margin-bottom:10px">Người từ Google vào những trang nào</h4>
    ${stackBar({items:[
      {k:'Trang thương mại', v:ps.out.thuong_mai?ps.out.thuong_mai.c:0, c:CO.up},
      {k:'Trang chủ', v:ps.out.homepage?ps.out.homepage.c:0, c:CO.navy},
      {k:'Bài blog', v:ps.out.blog?ps.out.blog.c:0, c:'#B9C6D6'}
    ], aria:'tỷ trọng click theo loại trang'})}
    <div class="legend">
      <span><i style="background:${CO.up}"></i><b>Trang khoá học ${ps.pctTM==null?'—':fp(ps.pctTM,1)}</b> — ${fi(ps.out.thuong_mai?ps.out.thuong_mai.c:0)} lượt bấm trên ${fi(ps.out.thuong_mai?ps.out.thuong_mai.n:0)} trang (khoá học, học phí, tuyển sinh, liên hệ)</span>
      <span><i style="background:${CO.navy}"></i>Trang chủ ${ps.tot.c?fp((ps.out.homepage?ps.out.homepage.c:0)/ps.tot.c,1):'—'} — ${fi(ps.out.homepage?ps.out.homepage.c:0)} lượt bấm</span>
      <span><i style="background:#B9C6D6"></i>Bài blog ${ps.tot.c?fp((ps.out.blog?ps.out.blog.c:0)/ps.tot.c,1):'—'} — ${fi(ps.out.blog?ps.out.blog.c:0)} lượt bấm trên ${fi(ps.out.blog?ps.out.blog.n:0)} bài</span>
    </div>
    <div class="cap">Luật phân loại nằm ở tab <b>CLASSIFY_RULES</b> (${(D.CLASSIFY_RULES||[]).filter(r=>r.loai_rule==='trang').length} luật cho trang).
     Sửa luật ở đó là đổi thẳng chỉ số quan trọng nhất của báo cáo này — sửa xong phải chạy lại script.</div>
  </div>`;

  h+=`${noteOff('down','◆',
    `<b>Vì sao tỷ lệ này thấp.</b> Trong ${fi(qs.tot.c)} lượt bấm của kỳ này,
     <b>${fi(qs.khac.c)} lượt</b> (${qs.tot.c?fp(qs.khac.c/qs.tot.c,1):'—'}) đến từ những câu tìm
     <b>không có dấu hiệu muốn học nghề</b> — người ta tìm hiểu kiến thức, tra thủ tục, hoặc tìm dịch vụ làm đẹp.
     Chỉ ${fi(qs.intent?qs.intent.c:0)} lượt bấm đến từ câu tìm chỗ học.
     Đây là vấn đề <b>chọn mục tiêu nội dung từ đầu</b>, không phải vấn đề kỹ thuật SEO.`)}</div>`;

  /* --- top trang --- */
  /* CÂU 3c — tra tiêu đề bài từ PAGE_META. Ghép theo đường dẫn đã chuẩn hoá
     (bỏ tên miền, bỏ tham số, ép có dấu / ở hai đầu) vì GSC lưu URL đầy đủ
     còn PAGE_META lưu đường dẫn tương đối. */
  function chuanUrl(u){
    let x=String(u||'').trim().replace(/^https?:\/\/[^/]+/,'').replace(/[?#].*$/,'');
    if(!x.startsWith('/')) x='/'+x;
    if(!x.endsWith('/')) x=x+'/';
    return x.toLowerCase();
  }
  const META=new Map();
  (D.PAGE_META||[]).forEach(r=>{ if(r.url) META.set(chuanUrl(r.url), {td:r.tieu_de||'', loai:r.loai||'', ngay:r.ngay_dang||''}); });
  const pages=(M.selPage?M.selPage.rows:[]).map(r=>{
    const mt=META.get(chuanUrl(r.url));
    return { url:r.url, c:toInt(r.clicks)||0, i:toInt(r.impressions), ctr:toRate(r.ctr),
      pos:toFloat(r.position), t:r.loai_trang||'blog',
      td: mt?mt.td:'', slug: chuanUrl(r.url) };
  }).sort((a,b)=>b.c-a.c);
  const soCoTieuDe = pages.filter(p=>p.td).length;
  const maxC=pages.length?pages[0].c:1;
  h+=`<div class="sec"><div class="sec-h"><h3>Trang mang click nhiều nhất</h3>
      <span class="src">hiển thị 40/${fi(pages.length)} trang · tra được tiêu đề cho ${fi(soCoTieuDe)}/${fi(pages.length)} · ${srcLink('PAGE_META')}</span></div>

      <button aria-pressed="false" onclick="pgF(this,'thuong_mai')">Chỉ trang thương mại</button>
      <button aria-pressed="false" onclick="pgF(this,'blog')">Chỉ blog</button>
    </div></div>
    <div class="tw"><table id="tb-page"><thead><tr><th>#</th><th>Trang — tiêu đề &amp; đường dẫn</th><th>Loại</th>
      ${th('Click','n','r')}${th('Hiển thị','n','r')}${th('CTR','n','r')}${th('Vị trí','n','r')}</tr></thead><tbody>`;
  pages.slice(0,40).forEach((p,i)=>{
    h+=`<tr data-t="${esc(p.t)}"><td class="r" style="color:var(--faint)">${i+1}</td>
      <td class="tt2">${p.td
          ? `<div style="font-weight:600;line-height:1.35">${esc(p.td)}</div>
             <div class="mono" style="font-size:11px;color:var(--faint);margin-top:2px">${esc(p.slug)}</div>`
          : `<div class="mono">${esc(p.url)}</div>

      <td class="r bar-cell" data-v="${p.c}"><span class="bg" style="width:${(p.c/maxC*100).toFixed(1)}%"></span><span><b>${fi(p.c)}</b></span></td>
      <td class="r" data-v="${p.i||0}">${fi(p.i)}</td><td class="r" data-v="${p.ctr||0}">${fp(p.ctr)}</td>
      <td class="r" data-v="${p.pos==null?999:p.pos}">${f1(p.pos)}</td></tr>`;
  });
